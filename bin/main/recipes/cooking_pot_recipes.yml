# ========================================
# Cooking pot recipe configuration
# ========================================
#
# Format:
#   <recipe_id>:
#     ingredients:           # Ingredient list, up to 6 entries
#       - <item_id_or_tag>   # Use a leading # for tags
#                            # Tag exclusions: "#namespace:tag,!namespace:item,!#namespace:other_tag"
#                            # Alternatives in one slot: "item_a|item_b|#namespace:tag"
#     container: <item_id>   # Optional, such as bowl or glass bottle
#     result: <item_id>
#     result-count: <count>  # Optional, defaults to 1
#     experience: <number>   # Optional, defaults to 0
#     cook-time: <ticks>     # Optional, defaults to 200
#     category: <type>       # Optional: meals, drinks, misc

cooking_pot_recipes:
