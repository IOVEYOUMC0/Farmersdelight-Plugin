  # Main dishes
  # ========================================
  
  beef_stew:
    ingredients:
      - "minecraft:beef|farmersdelight:minced_beef"
      - "minecraft:carrot"
      - "minecraft:potato"
    container: "minecraft:bowl"
    result: "farmersdelight:beef_stew"
    experience: 1.0
    cook-time: 200
    category: meals
  
