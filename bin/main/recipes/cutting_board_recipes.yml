# ========================================
# Cutting board recipe configuration
# ========================================
#
# Format:
#   <recipe_id>:
#     input: <item_id_or_tag>    # Use a leading # for tags
#     tool: <tool_tag>           # Example: farmersdelight:knives, minecraft:axes
#                              # Tool exclusions: "farmersdelight:knives,!namespace:item,!#namespace:tag"
#     results:                   # Output item list
#       - item: <item_id>
#         count: <amount>        # Optional, defaults to 1
#         chance: <0.0-1.0>      # Optional, defaults to 1.0
#     sound: <sound_id>          # Optional, defaults to entity.sheep.shear

cutting_board_recipes:
  # ========================================
  # Basic processing
  # ========================================

  rice_panicle:
    input: "farmersdelight:rice_panicle"
    tool: "farmersdelight:knives"
    results:
      - item: "farmersdelight:rice"
      - item: "farmersdelight:straw"

  wild_rice:
    input: "farmersdelight:wild_rice"
    tool: "farmersdelight:knives"
    results:
      - item: "farmersdelight:rice"
      - item: "farmersdelight:straw"
        chance: 0.5

  raw_pasta:
    input: "farmersdelight:wheat_dough"
    tool: "farmersdelight:knives"
    results:
      - item: "farmersdelight:raw_pasta"

  # Reserved for future generic dough-tag support.
  # The current content pack only defines farmersdelight:wheat_dough,
  # so a forge-style dough tag is not available yet.

  wild_tomatoes:
    input: "farmersdelight:wild_tomatoes"
    tool: "farmersdelight:knives"
    results:
      - item: "farmersdelight:tomato_seeds"
      - item: "farmersdelight:tomato"
        chance: 0.2
      - item: "minecraft:green_dye"
        chance: 0.1

  wild_cabbages:
    input: "farmersdelight:wild_cabbages"
    tool: "farmersdelight:knives"
    results:
      - item: "farmersdelight:cabbage_seeds"
      - item: "minecraft:yellow_dye"
