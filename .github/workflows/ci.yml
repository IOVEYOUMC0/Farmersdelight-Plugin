name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        debug-tools: [false, true]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ApiDocsDriftTest compares the addon-facing api documentation, which lives in the wiki repository,
      # against the code. The wiki checkout is what lets that test run; it fails rather than skips when the
      # documentation is missing.
      - name: Checkout the wiki (api documentation)
        uses: actions/checkout@v4
        with:
          repository: IOVEYOUMC0/FarmersdelightPluginWiKi
          path: wiki

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and run all JUnit tests
        run: ./gradlew clean build -PdebugTools=${{ matrix.debug-tools }} --no-daemon --stacktrace

      - name: Require zero failing, errored or skipped tests
        run: python3 tools/check_test_results.py .

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-debug-${{ matrix.debug-tools }}
          path: build/reports/tests/test/
          if-no-files-found: ignore

  lint:
    name: Repo contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checker dependencies
        run: python -m pip install --quiet pyyaml

      - name: Run every repository contract and checker self-test
        run: python tools/run_all_checks.py --quiet
