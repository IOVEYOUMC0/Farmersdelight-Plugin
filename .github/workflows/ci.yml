name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ApiDocsDriftTest compares the addon-facing api documentation, which lives in the wiki repository,
      # against the code. The wiki checkout is what lets that test run; it fails rather than skips when the
      # documentation is missing.
      - name: Checkout the wiki (api documentation)
        uses: actions/checkout@v4
        with:
          repository: IOVEYOUMC0/FarmersdelightPluginWiKi
          path: wiki

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test --no-daemon --stacktrace

      # All five addon repositories compile against this jar.
      - name: Build the api jar addons compile against
        run: ./gradlew apiJar --no-daemon --stacktrace

      # src/debugTools/java joins the main source set only with -PdebugTools=true (build.gradle.kts), so no
      # other step compiles it. Last build step on purpose: the test and api-jar steps above keep producing
      # the release configuration's output.
      - name: Compile the debug-tools source set
        run: ./gradlew compileJava -PdebugTools=true --no-daemon --offline --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test/
          if-no-files-found: ignore

  lint:
    name: Repo contract checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The checks below cover the contracts a running server depends on: shipped CraftEngine configuration
      # carries no comments, meal icons match the recipes that produce them, every language key is defined in
      # both locales, no shipped YAML file repeats a mapping key, addons compile against the api facade only,
      # every config path the code reads exists in a shipped file, and no two custom blocks pin the same
      # vanilla block state.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install checker dependencies
        run: python -m pip install --quiet pyyaml

      - name: CraftEngine config files carry no comments
        run: python tools/strip_ce_comments.py --check

      - name: Meal icons match the cooking pot recipes
        run: python tools/meal_icons.py --check

      - name: Language keys are defined in both locales
        run: python tools/check_lang_keys.py --quiet

      # An addon may compile against api.** only, never against FarmersDelight internals. The check also
      # rejects an api class that exposes an internal type in a public signature without the
      # @ApiStatus.Internal marker.
      - name: Addons only depend on the api facade
        run: python tools/check_api_boundary.py --quiet

      # ConfigLookup falls back to the compiled default when none of a call site's aliases is set, so a
      # renamed or misspelled path silently ignores the operator's value instead of failing. Every literal
      # path the code reads is resolved against the files shipped here; an intentional exception marks itself
      # in the source with "config-path-check: no shipped key, on purpose".
      - name: Every config path read exists in a shipped file
        run: python tools/check_config_paths.py --quiet

      # A repeated mapping key is not a YAML error: yaml.safe_load, and CraftEngine's own loader, keep the
      # last value and report nothing, so the earlier block disappears silently. The check walks the node
      # tree with yaml.compose, where both keys are still visible.
      - name: No shipped YAML file repeats a mapping key
        run: python tools/check_duplicate_yaml_keys.py --quiet

      # Two custom blocks that pin the same vanilla block state are indistinguishable in the world, so the
      # second one placed behaves like the first. One block reusing a state across its own faces is normal
      # and is only listed in the log.
      - name: No two custom blocks pin the same vanilla block state
        run: python tools/check_block_state_occupancy.py
