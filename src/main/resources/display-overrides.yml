# Knife detection. Recommended to keep both tags and explicit items: tags for CE resource-side extension, explicit items as a fallback.
# This is the knife definition for the whole plugin, not only for drops: the cutting board, the skillet,
# mushroom colony harvesting, rice harvesting, straw drops, the knife icon in the recipe viewer and the
# knife achievements all read it, as do addon drop rules registered without their own tool list.
