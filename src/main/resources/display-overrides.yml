# Batch-override displays by item tag. key may omit #, or use a quoted "#namespace:tag" in items.
tags:
  # Vanilla item tags that cover whole families of 3D-block-with-2D-item entries — saves listing every
  # wood/colour variant individually. Unknown tags are ignored at lookup, so versions that lack a tag
  # just won't apply the override.
