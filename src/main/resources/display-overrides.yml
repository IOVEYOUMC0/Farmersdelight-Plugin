# Per-item and per-tag display tables for items placed on a cutting board (and on the FD stations that
# reuse the same board rendering). Kept out of config.yml so the settings there stay readable; the board
# settings themselves (default offset, spread) remain in config.yml under cutting-board.
#
# items: key is the item id stored on the board, which can be minecraft:* or a CraftEngine item id.
# tags:  batch-override whole item-tag families; the key may omit '#', or use a quoted "#namespace:tag".
#
# Per-key options:
#   display-item: use another item as the display model, good when the original model renders incorrectly in an ItemDisplay.
#   style: auto detects automatically; item forces a flat item; block forces a block/3D item.
#   position: extra offset on top of the global default-display-offset, format x,y,z.
#   translation: internal translation of the ItemDisplay transformation. Usually leave default, adjust only when the model's own pivot is off.
#   rotation: directly override the display rotation angles, format x,y,z in degrees.
#   scale: directly override the scale, format x,y,z; can also be a single number such as 0.55.
#
# Example:
#   items:
#     farmersdelight:tomato:
#       display-item: farmersdelight:tomato_display
#       style: item
#       position: 0,0.02,0
#       translation: 0,0,0
#       rotation: 90,180,0
#       scale: 0.55

items:
  farmersdelight:stove:
    style: block
  farmersdelight:cooking_pot:
    style: block
  farmersdelight:cutting_board:
    style: block
  farmersdelight:skillet:
    style: block
    rotation: -90,90,0
    position: 0,-0.225,0
  farmersdelight:basket:
    style: block
  farmersdelight:bamboo_basket:
    style: block
  farmersdelight:wooden_basket:
    style: block
  farmersdelight:tray:
    style: block
  # 3D blocks whose item icon is 2D (item/generated parent in the vanilla model) — placed on the board
  # they read as flat sprites instead of awkward floating meshes. Unknown ids are ignored silently
  # (CuttingBoardDisplayConfig validates only the namespace:id format, never material existence), so
  # cross-version item lists are safe — e.g. pale_oak_sapling on 1.21.1.
