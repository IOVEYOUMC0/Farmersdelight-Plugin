# ========================================
# 炖锅配方配置
# ========================================
#
# 格式：
#   <recipe_id>:
#     ingredients:           # 原料列表，最多 6 项
#       - <item_id_or_tag>   # 标签需以 # 开头
#                            # 标签排除写法："#namespace:tag,!namespace:item,!#namespace:other_tag"
#                            # 同一槽位的可选项写法："item_a|item_b|#namespace:tag"
#     container: <item_id>   # 可选，例如碗或玻璃瓶
#     result: <item_id>
#     result-count: <count>  # 可选，默认为 1
#     experience: <number>   # 可选，默认为 0
#     cook-time: <ticks>     # 可选；默认值与上下限见 config.yml 中的 cooking-pot.cooking
#     category: <type>       # 可选：meals、drinks、misc
#     priority: <number>     # 可选；当配方重叠时，优先级更高者生效
#
# 自定义炖锅配方：
#   使用 custom_cooking_pot_recipes.<id>，其中 <id> 需与 CraftEngine 方块行为中的
#   behavior.custom.id 相匹配。配方主体与上文相同，
#   但自定义炖锅在其 input-slots 允许时可使用超过 6 种原料。
#   自定义炖锅仍可使用默认的 cooking_pot_recipes。自定义分组中的配方
#   会被优先检查，且具有相同 id 的自定义配方会在配方 GUI 中
#   覆盖默认配方。
# 示例：
# custom_cooking_pot_recipes:
#   custom:
#     large_stew:
#       ingredients:
#         - "minecraft:beef"
#         - "minecraft:carrot"
#       container: "minecraft:bowl"
#       result: "farmersdelight:beef_stew"

