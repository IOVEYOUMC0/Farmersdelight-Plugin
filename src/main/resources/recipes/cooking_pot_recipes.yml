# ========================================
# Cooking pot recipe configuration
# ========================================
#
# Format:
#   <recipe_id>:
#     ingredients:           # ingredient list, up to 6 entries
#       - <item_id_or_tag>   # tags must start with #
#                            # tag exclusion: "#namespace:tag,!namespace:item,!#namespace:other_tag"
#                            # alternatives for the same slot: "item_a|item_b|#namespace:tag"
#     container: <item_id>   # optional, e.g. a bowl or glass bottle
#     result: <item_id>
#     result-count: <count>  # optional, default 1
#     experience: <number>   # optional, default 0
#     cook-time: <ticks>     # optional; default and bounds are in cooking-pot.cooking in config.yml
#     category: <type>       # optional: meals, drinks, misc
#     priority: <number>     # optional; when recipes overlap, the higher priority wins
#
# Custom cooking pot recipes:
#   Use custom_cooking_pot_recipes.<id>, where <id> must match
#   behavior.custom.id in the CraftEngine block behavior. The recipe body is the same as above,
#   but a custom pot may use more than 6 ingredients when its input-slots allow it.
#   Custom pots can still use the default cooking_pot_recipes. Recipes in a custom group
#   are checked first, and a custom recipe with the same id overrides
#   the default recipe in the recipe GUI.
# Example:
# custom_cooking_pot_recipes:
#   custom:
#     large_stew:
#       ingredients:
#         - "minecraft:beef"
#         - "minecraft:carrot"
#       container: "minecraft:bowl"
#       result: "farmersdelight:beef_stew"

