special_recipes:
  # Organic Compost breaks down into Rich Soil, sped up by sunlight, adjacent water and nearby
  # activators (mushrooms, podzol/mycelium, other compost-family blocks, mushroom colonies...).
  organic_compost:
    title: "gui.special_recipe.organic_compost.title"
    icon: "farmersdelight:organic_compost"
    description:
      - "gui.special_recipe.organic_compost.desc.1"
      - "gui.special_recipe.organic_compost.desc.2"
      - "gui.special_recipe.organic_compost.desc.3"
      - "gui.special_recipe.organic_compost.desc.4"
    inputs:
      - item: "farmersdelight:organic_compost"
    outputs:
      - item: "farmersdelight:rich_soil"
        lore:
          - "gui.special_recipe.organic_compost.output.rich_soil_lore"
    conditions:
      sunlight: true
      water: true
      catalyst_info: true
    # Catalysts are read straight from the organic_compost block behavior's configured "activators"
    # list (craftengine/farmersdelight/configuration/blocks.yml), so the detail page always mirrors
    # exactly which blocks accelerate composting — no separate tag to keep in sync.
    catalysts:
      - behavior: farmersdelight:organic_compost
        list: activators
  # Wild crops — pure description pages (where each wild plant can be found). Only the wild crops
  # this plugin actually registers are listed.
  wild_cabbages:
    title: "gui.special_recipe.wild_cabbages.title"
    icon: "farmersdelight:wild_cabbages"
    display-type: "item_description"
    description:
      - "gui.special_recipe.wild_cabbages.desc.1"
  wild_onions:
    title: "gui.special_recipe.wild_onions.title"
    icon: "farmersdelight:wild_onions"
    display-type: "item_description"
    description:
      - "gui.special_recipe.wild_onions.desc.1"
  wild_tomatoes:
    title: "gui.special_recipe.wild_tomatoes.title"
    icon: "farmersdelight:wild_tomatoes"
    display-type: "item_description"
    description:
      - "gui.special_recipe.wild_tomatoes.desc.1"
  wild_rice:
    title: "gui.special_recipe.wild_rice.title"
    icon: "farmersdelight:wild_rice"
    display-type: "item_description"
    description:
      - "gui.special_recipe.wild_rice.desc.1"
  # Item info pages — ingredient-info style entries for non-craftable items.
  wheat_dough:
    title: "gui.special_recipe.wheat_dough.title"
    icon: "farmersdelight:wheat_dough"
    display-type: "item_description"
    description:
      - "gui.special_recipe.wheat_dough.desc.1"
      - "gui.special_recipe.wheat_dough.desc.2"
  straw:
    title: "gui.special_recipe.straw.title"
    icon: "farmersdelight:straw"
    display-type: "item_description"
    description:
      - "gui.special_recipe.straw.desc.1"
  ham:
