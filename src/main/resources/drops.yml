# Extra straw drops when breaking grass, mature wheat or mature rice with a knife.
# short_grass, tall_grass and mature_wheat use CraftEngine vanilla loot for their item drop; these values
# still define their advancement match. mature_rice and any additional key are dropped by the plugin listener.
straw:
  short_grass:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 1
  tall_grass:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 1
  mature_wheat:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 1
  mature_rice:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 1
