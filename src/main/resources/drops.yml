# Extra drops that knives (and other configured tools) produce.
#
# The mob drops themselves are defined by the bundled CraftEngine pack, in
# craftengine/farmersdelight/configuration/vanilla_loots.yml (the farmersdelight:ham_from_* and
# farmersdelight:*_from_* entries): killing an adult animal with a configured knife adds its knife drop,
# and a burning animal yields the smoked variant. Tune them there.
#
# A knife drop rule registered by another plugin through the FarmersDelightKnifeDrops api is unaffected by
# this file and keeps working.

# Blocks whose knife break (or knife harvest) earns the harvest_straw advancement.
# The straw item itself is defined by the CraftEngine packs, not here: vanilla grass and mature wheat drop
# it through vanilla_loots.yml, mature rice through the break-loot chain of farmersdelight:rice in
# crops.yml. Keeping a key listed enables the advancement for that block; removing the key disables the
# whole rule. An additional block needs its own CraftEngine loot entry to actually drop straw.
straw:
  short_grass:
  tall_grass:
  mature_wheat:
  mature_rice:
