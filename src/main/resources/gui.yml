  recipe-detail-cutting-board:
    title: "<white><offset><icon><shift:-1600>配方详细"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-8>"
        icon: "<image:farmersdelight:cutting_board_menu>"
    layout:
      - "B########"
      - "#########"
      - "#########"
      - "#I#T#RR##"
      - "#####RR##"
      - "#########"
    legend:
      I: input
      R: result
      T: tool
      B: back
      "#": background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      back:
        material: ARROW
        name: "返回"
