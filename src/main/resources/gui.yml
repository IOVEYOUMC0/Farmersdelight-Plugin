recipe-view-gui:
  background-items-enabled: true
  show-ingredient-ids: false
  max-preview-ingredients: 4

  main-menu:
    title: "<white>农夫乐事"
    rows: 3
    layout:
      - "#########"
      - "##C###D##"
      - "####B####"
    legend:
      C: cooking_pot
      D: cutting_board
      B: back
      "#": background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      cooking_pot:
        material: CAULDRON
        name: "烹饪锅配方"
        lore:
          - "点击此处查看配方"
      cutting_board:
        material: BAMBOO_MOSAIC
        name: "砧板配方"
        lore:
          - "点击此处查看配方"
      back:
        material: BARRIER
        name: "关闭页面"

  recipe-list:
    title: "<white><offset><icon><shift:-1600>配方列表 <gray>{page}/{total}</gray>"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-7>"
        icon: "<image:farmersdelight:recipelist>"
    layout:
      - "P#F#B###N"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
    legend:
      R: recipe
      P: prev_page
      N: next_page
      B: back
      X: info
      F: filter
      "#": background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      prev_page:
        material: ARROW
        name: "上一页"
      next_page:
        material: ARROW
        name: "下一页"
      back:
        material: BARRIER
        name: "返回"
      info:
        material: BOOK
        name: "配方查看"
        lore:
          - "页数: {page}/{total}"
      filter:
        material: COMPASS
        name: "筛选可烹饪配方"
      filter-on:
        material: LIME_DYE
        name: "仅显示可烹饪"
      filter-off:
        material: GRAY_DYE
        name: "显示全部配方"

  recipe-detail-cooking-pot:
    title: "<white><offset><icon><shift:-1600>配方详细"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-8>"
        icon: "<image:farmersdelight:cooking_pot_menu>"
    layout:
      - "B######P#"
      - "#####A###"
      - "#III#####"
      - "#III#####"
      - "#####C#R#"
      - "#########"
    legend:
      R: result
      I: ingredient
      A: arrow
      C: container
      B: back
      P: fill
      "#": background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      arrow:
        item: farmersdelight:cooking_time
        name: "烹饪过程"
      back:
        material: ARROW
        name: "返回"
      # 配方详情页的填入按钮。
      # 普通点击：每个配方材料最多填入 1 个匹配物品。
      # Shift 点击：循环匹配材料，尽量填满厨锅输入槽。
      # 完全没有可匹配材料时不会移动锅内物品，按钮显示 fill-missing。
      # 锅内原物品无法安全退回玩家背包时不会执行填入，按钮显示 fill-inventory-full。
      fill:
        material: HOPPER
        name: "填入材料"
        lore:
          - "&e从背包移动匹配的材料。"
          - "&7Shift 点击填满可匹配材料。"
      fill-success:
        material: HOPPER
        name: "填入材料"
        lore:
          - "&a已把匹配材料填入厨锅。"
      fill-missing:
        material: HOPPER
        name: "填入材料"
        lore:
          - "&c背包内没有可匹配该配方的材料。"
          - "&7Shift 点击填满可匹配材料。"
      fill-inventory-full:
        material: BARRIER
        name: "填入材料"
        lore:
          - "&c背包空间不足，无法安全移动锅内物品。"

  # Custom cooking pot recipe detail GUIs. Key must match behavior.custom.id.
  # If a custom pot has no matching entry here, the plugin falls back to
  # recipe-detail-cooking-pot and logs a console warning once per custom id.
  recipe-detail-cooking-pot-guis: {}

