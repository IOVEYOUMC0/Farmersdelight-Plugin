  recipe-detail-cutting-board:
    title: "<white><offset><icon><shift:-1600><lang:gui.recipe.detail_title>"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-1>"
        icon: "<image:farmersdelight:cutting_board_menu>"
    layout:
      - "BXXXXXXXX"
      - "XXXXXXXXX"
      - "XIXTXRRXX"
      - "XXXXXRRXX"
      - "XXXXXXXXX"
      - "XXXXXXXXX"
    legend:
      I: input
      R: result
      T: tool
      B: back
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      back:
        material: ARROW
        item_model: "air"
        name: "<gray><lang:gui.recipe.back>"

# Addon recipe book: the generic book that shows recipes registered by addons (e.g. Brewin' And Chewin'
# kegs), opened via /fd recipe book or the recipe-menu button. When only one addon type is registered it
# opens straight to that type's list. The list page size follows the number of `recipe` slots.
# Layout slot types: category (menu, one per addon type), recipe (list), ingredient + result (detail),
# prev_page, next_page, fill, back, background. List/detail titles come from the recipe type itself.
recipe-book-gui:
  menu:
    title: "<white><lang:gui.recipe.book_title>"
    rows: 6
    layout:
      - "XXXXXXXXX"
      - "XCCCCCCCX"
      - "XCCCCCCCX"
      - "XCCCCCCCX"
      - "XCCCCCCCX"
      - "XXXXBXXXX"
    legend:
      C: category
      B: back
      X: background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      back:
        material: BARRIER
        name: "<red><lang:gui.recipe.close>"
  list:
    rows: 6
    layout:
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "PXXXBXXXN"
    legend:
      R: recipe
      P: prev_page
      N: next_page
      B: back
      X: background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      prev_page:
        material: ARROW
        name: "<green><lang:gui.recipe.prev_page>"
      next_page:
        material: ARROW
        name: "<green><lang:gui.recipe.next_page>"
      back:
        material: BARRIER
        name: "<gray><lang:gui.recipe.back>"
  detail:
    rows: 6
    layout:
      - "XXXXXXXXX"
      - "XIIIIIIRX"
      - "XXXXXXXXX"
      - "XXXXXXXXX"
      - "XXXXXXXXX"
      - "XXXXBXXFX"
    legend:
      I: ingredient
      R: result
      F: fill
      B: back
      X: background
    items:
      background:
        material: GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      fill:
        material: HOPPER
        name: "<green><lang:gui.recipe.fill>"
      back:
        material: ARROW
        name: "<gray><lang:gui.recipe.back>"

# Cooking pot recipe editor GUI. Opened with /fd recipe edit pot <id> [group].
# Slot text and materials are configured here, not hardcoded. Dynamic values use placeholders:
# info: {recipe_id} {type}; result-count: {count}; cook-time: {cook_time} {seconds};
# experience: {experience}; priority: {priority}; category: {category}
recipe-editor-gui:
  title: "<white><lang:gui.editor.cooking_pot.title>"
  rows: 6
  layout:
    - "####i####"
    - "#III#C#R#"
    - "#III###N#"
    - "#########"
    - "#T#E#P#G#"
    - "X###D###S"
  legend:
    i: info
    I: ingredient
    C: container
    R: result
    N: result-count
    T: cook-time
    E: experience
    P: priority
    G: category
    X: cancel
    D: delete
    S: save
    "#": background
  items:
    background:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      item_model: "air"
      hide-tooltip: true
      name: " "
    info:
      material: KNOWLEDGE_BOOK
      name: "<green><lang:'gui.editor.cooking_pot.info':'<white>{recipe_id}'>"
      lore:
        - "<gray><lang:'gui.editor.info.type':'<white>{type}'>"
        - "<gray><lang:gui.editor.help.copy_to_cursor>"
        - "<gray><lang:gui.editor.help.put_take>"
        - "<gray><lang:gui.editor.help.number_slot>"
        - "<gray><lang:gui.editor.help.advanced_click>"
        - "<gray><lang:gui.editor.help.no_consume>"
    ingredient:
      material: GRAY_STAINED_GLASS_PANE
      name: "<gray><lang:gui.editor.ingredient_empty>"
      lore:
        - "<gray><lang:gui.editor.ingredient_hint>"
    container:
      material: GRAY_STAINED_GLASS_PANE
      name: "<aqua><lang:gui.editor.container_optional>"
      lore:
        - "<gray><lang:gui.editor.container_hint>"
    result:
      material: GRAY_STAINED_GLASS_PANE
      name: "<green><lang:gui.editor.result_empty>"
      lore:
        - "<gray><lang:gui.editor.result_hint>"
    result-count:
      material: PAPER
      name: "<yellow><lang:'gui.editor.result_count':'<white>{count}'>"
      lore:
        - "<gray><lang:gui.editor.hint_pm1>"
    cook-time:
      material: CLOCK
      name: "<yellow><lang:'gui.editor.cook_time_label':'<white>{cook_time}':'{seconds}'>"
      lore:
        - "<gray><lang:gui.editor.hint_cook_time_plus>"
        - "<gray><lang:gui.editor.hint_cook_time_minus>"
    experience:
      material: EXPERIENCE_BOTTLE
      name: "<yellow><lang:'gui.editor.experience_label':'<white>{experience}'>"
      lore:
        - "<gray><lang:gui.editor.hint_exp_plus>"
        - "<gray><lang:gui.editor.hint_exp_minus>"
    priority:
      material: COMPARATOR
      name: "<yellow><lang:'gui.editor.priority_label':'<white>{priority}'>"
      lore:
        - "<gray><lang:gui.editor.hint_pm1>"
    category:
      material: BOOK
      name: "<yellow><lang:'gui.editor.category_label':'<white>{category}'>"
      lore:
        - "<gray><lang:gui.editor.category_hint>"
    save:
      material: LIME_CONCRETE
      name: "<green><lang:gui.editor.button.save>"
      lore:
        - "<gray><lang:gui.editor.button.save_hint>"
    cancel:
      material: BARRIER
      name: "<red><lang:gui.editor.button.cancel>"
      lore:
        - "<gray><lang:gui.editor.button.cancel_hint>"
    delete:
      material: LAVA_BUCKET
      name: "<dark_red><lang:gui.editor.button.delete>"
      lore:
        - "<gray><lang:gui.editor.button.delete_hint>"

# Custom cooking pot (large pot) editor GUI overrides. Key names must equal behavior.custom.id.
# When missing, falls back to recipe-editor-gui and warns once in the console.
# Custom pots can extend the ingredient slots to more entries here, to hold more ingredients.
recipe-editor-cooking-pot-guis: {}

# Delete recipe confirmation page. Opened when clicking the editor's delete button.
# info: {recipe_id}
recipe-editor-confirm-delete-gui:
