recipe-view-gui:
  background-items-enabled: true
  show-ingredient-ids: false
  max-preview-ingredients: 4

  main-menu:
    title: "<white><lang:gui.recipe.title>"
    rows: 3
    layout:
      - "XXXXXXXXX"
      - "XXCXRXDXX"
      - "XXXXBXXXX"
    legend:
      C: cooking_pot
      D: cutting_board
      R: recipe_book
      B: back
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      cooking_pot:
        material: CAULDRON
        name: "<gold><lang:gui.recipe.cooking_pot>"
        lore:
          - "<gray><lang:gui.recipe.cooking_pot_lore>"
      cutting_board:
        material: BAMBOO_MOSAIC
        name: "<yellow><lang:gui.recipe.cutting_board>"
        lore:
          - "<gray><lang:gui.recipe.cutting_board_lore>"
      recipe_book:
        material: KNOWLEDGE_BOOK
        name: "<aqua><lang:gui.recipe.recipe_book>"
        lore:
          - "<gray><lang:gui.recipe.recipe_book_lore>"
      back:
        material: BARRIER
        name: "<red><lang:gui.recipe.close>"

  recipe-list:
    title: "<white><offset><icon><shift:-1600><lang:gui.recipe.list_title> <gray>{page}/{total}</gray>"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-1>"
        icon: "<image:farmersdelight:recipelist>"
    layout:
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "PXFXBXXXN"
    legend:
      R: recipe
      P: prev_page
      N: next_page
      B: back
      F: filter
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      prev_page:
        material: ARROW
        item_model: "air"
        name: "<green><lang:gui.recipe.prev_page>"
      next_page:
        material: ARROW
        item_model: "air"
        name: "<green><lang:gui.recipe.next_page>"
      back:
        material: BARRIER
        name: "<gray><lang:gui.recipe.back>"
        # The back/close button also accepts an optional command list, run one tick after the
        # menu closes. Fields command, commands, and cmd are all read and merged. Prefix an
        # entry with [console] to run it as the console, or [player] (the default) to run it as
        # the clicking player. Placeholders: {player} {player_name} %player% %player_name%
        # {uuid} {world}. Reopening another menu must go through this list rather than a raw
        # command, because an inventory cannot be opened during the click event itself. These
        # fire when the list was opened via /fd recipe cooking_pot or /fd recipe cutting_board.
        # commands:
        #   - "[player] menu open hub"
        #   - "[console] tellraw {player} {\"text\":\"Returning to the hub\"}"
      close:
        material: BARRIER
        name: "<red><lang:gui.recipe.close>"
      info:
        material: BOOK
        name: "<dark_gray><lang:gui.recipe.title>"
        lore:
          - "<lang:'gui.recipe.page':'{page}':'{total}'>"
      filter:
        material: COMPASS
        name: "<gray><lang:gui.recipe.filter>"
      filter-on:
        item: farmersdelight:cooking_pot_can_cooked_enabled
      filter-off:
        item: farmersdelight:cooking_pot_can_cooked_disenabled

  recipe-detail-cooking-pot:
    title: "<white><offset><icon><shift:-1600><lang:gui.recipe.detail_title>"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-1>"
        icon: "<image:farmersdelight:cooking_pot_menu>"
    layout:
      - "BXXXXXXPX"
      - "XXXXXAXXX"
      - "XIIIXGXXX"
      - "XIIIXXXXX"
      - "XXXXXCXRX"
      - "XXXXXXXXX"
    legend:
      R: result
      I: ingredient
      A: arrow
      C: container
      B: back
      P: fill
      G: progress
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      arrow:
        item: farmersdelight:cooking_time
        name: "<yellow><lang:gui.recipe.arrow_name>"
        lore:
          - "<gray><lang:'gui.recipe.cook_time_line':'<aqua>{cook_time}'>"
          - "<gray><lang:'gui.recipe.experience_line':'<green>{experience}'>"
      back:
        material: ARROW
        item_model: "air"
        name: "<gray><lang:gui.recipe.back>"
      fill:
        material: HOPPER
        name: "<green><lang:gui.recipe.fill>"
        lore:
          - "<yellow><lang:gui.recipe.fill_hint>"
          - "<gray><lang:gui.recipe.fill_hint_shift>"
      fill-success:
        material: HOPPER
        name: "<green><lang:gui.recipe.fill>"
        lore:
          - "<green><lang:gui.recipe.fill_success>"
      fill-missing:
        material: HOPPER
        name: "<green><lang:gui.recipe.fill>"
        lore:
          - "<red><lang:gui.recipe.fill_missing>"
          - "<gray><lang:gui.recipe.fill_hint_shift>"
      fill-inventory-full:
        material: BARRIER
        name: "<green><lang:gui.recipe.fill>"
        lore:
          - "<red><lang:gui.recipe.fill_inventory_full>"

  # Custom cooking pot recipe detail GUIs. Key must match behavior.custom.id.
  # If a custom pot has no matching entry here, the plugin falls back to
  # recipe-detail-cooking-pot and logs a console warning once per custom id.
  recipe-detail-cooking-pot-guis: {}

  # Example: recipe-detail GUI for the `large_pot` test variant (paired with
