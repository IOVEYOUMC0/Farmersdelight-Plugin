# FarmersDelight GUI 配置
# 界面布局、按钮、标题和贴图在此文件中配置。
# 每个 GUI 的 layout 用字符表示槽位，legend 把字符映射到槽位类型。
# items 下的每个按钮都可以使用 material（原版材质）或 item（CraftEngine 物品）。
# 可选字段：name、lore、name-key、lore-keys、custom-model-data、item-model/item_model、hide-tooltip/hide_tooltip。

cooking-pot-gui:
  title: "<white><offset><icon><shift:-1600>烹饪锅"
  fillers-enabled: true
  title-layout:
    craftengine:
      offset: "<shift:-8>"
      icon: "<image:farmersdelight:cooking_pot_gui>"
  rows: 3

  layout:
    - "XIIIXPXBX"
    - "RIIIXXXXX"
    - "XXHXXCXOX"

  legend:
    I: ingredient
    H: heat
    C: container
    P: progress
    B: buffer
    O: output
    R: recipe
    X: decoration

  items:
    background:
      material: GRAY_STAINED_GLASS_PANE
      item_model: "air"
      hide-tooltip: true
      name: " "
    decoration:
      material: BROWN_STAINED_GLASS_PANE
      name: " "
    heat-active:
      item: farmersdelight:cooking_pot_heated
    heat-inactive:
      item: farmersdelight:cooking_pot_not_heated
    progress:
      item: farmersdelight:cooking_time
      name: "烹饪时长"
      lore:
        - "剩余: {time} 秒"
    recipe:
      material: KNOWLEDGE_BOOK
      name: "查看烹饪配方"
      lore:
        - "点击此处查看配方"

  progress-items:
    - item: farmersdelight:0
    - item: farmersdelight:1
    - item: farmersdelight:2
    - item: farmersdelight:3
    - item: farmersdelight:4
    - item: farmersdelight:5
    - item: farmersdelight:6
    - item: farmersdelight:7
    - item: farmersdelight:8
    - item: farmersdelight:9
    - item: farmersdelight:10
    - item: farmersdelight:11
    - item: farmersdelight:12
    - item: farmersdelight:13
    - item: farmersdelight:14
    - item: farmersdelight:15
    - item: farmersdelight:16
    - item: farmersdelight:17
    - item: farmersdelight:18
    - item: farmersdelight:19
    - item: farmersdelight:20

# 自定义厨锅 GUI。键名对应 CE 方块行为里的 behavior.custom.id。
# 不写对应 id 时自动使用上面的 cooking-pot-gui。
cooking-pot-guis: {}

