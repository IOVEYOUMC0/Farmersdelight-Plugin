recipe-view-gui:
  background-items-enabled: true
  show-ingredient-ids: false
  max-preview-ingredients: 4

  main-menu:
    title: "<white>农夫乐事"
    rows: 3
    layout:
      - "XXXXXXXXX"
      - "XXCXXXDXX"
      - "XXXXBXXXX"
    legend:
      C: cooking_pot
      D: cutting_board
      B: back
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      cooking_pot:
        material: CAULDRON
        name: "烹饪锅配方"
        lore:
          - "点击此处查看配方"
      cutting_board:
        material: BAMBOO_MOSAIC
        name: "砧板配方"
        lore:
          - "点击此处查看配方"
      back:
        material: BARRIER
        name: "关闭页面"

  recipe-list:
    title: "<white><offset><icon><shift:-1600>配方列表 <gray>{page}/{total}</gray>"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-1>"
        icon: "<image:farmersdelight:recipelist>"
    layout:
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "RRRRRRRRR"
      - "PXFXBXXXN"
    legend:
      R: recipe
      P: prev_page
      N: next_page
      B: back
      F: filter
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      prev_page:
        material: ARROW
        item_model: "air"
        name: "上一页"
      next_page:
        material: ARROW
        item_model: "air"
        name: "下一页"
      back:
        material: BARRIER
        name: "返回"
      info:
        material: BOOK
        name: "配方查看"
        lore:
          - "页数: {page}/{total}"
      filter:
        material: COMPASS
        name: "筛选可烹饪配方"
      filter-on:
        item: farmersdelight:cooking_pot_can_cooked_enabled
      filter-off:
        item: farmersdelight:cooking_pot_can_cooked_disenabled

  recipe-detail-cooking-pot:
    title: "<white><offset><icon><shift:-1600>配方详细"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-1>"
        icon: "<image:farmersdelight:cooking_pot_menu>"
    layout:
      - "BXXXXXXPX"
      - "XXXXXAXXX"
      - "XIIIXGXXX"
      - "XIIIXXXXX"
      - "XXXXXCXRX"
      - "XXXXXXXXX"
    legend:
      R: result
      I: ingredient
      A: arrow
      C: container
      B: back
      P: fill
      G: progress
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      arrow:
        item: farmersdelight:cooking_time
        name: "烹饪过程"
        lore:
          - "&7烹饪时间: &b{cook_time}"
          - "&7经验: &a{experience}"
      back:
        material: ARROW
        item_model: "air"
        name: "返回"
      # 配方详情页的填入按钮。
      # 普通点击：每个配方材料最多填入 1 个匹配物品。
      # Shift 点击：循环匹配材料，尽量填满厨锅输入槽。
      # 完全没有可匹配材料时不会移动锅内物品，按钮显示 fill-missing。
      # 锅内原物品无法安全退回玩家背包时不会执行填入，按钮显示 fill-inventory-full。
      fill:
        material: HOPPER
        name: "填入材料"
        lore:
          - "&e从背包移动匹配的材料。"
          - "&7Shift 点击填满可匹配材料。"
      fill-success:
        material: HOPPER
        name: "填入材料"
        lore:
          - "&a已把匹配材料填入厨锅。"
      fill-missing:
        material: HOPPER
        name: "填入材料"
        lore:
          - "&c背包内没有可匹配该配方的材料。"
          - "&7Shift 点击填满可匹配材料。"
      fill-inventory-full:
        material: BARRIER
        name: "填入材料"
        lore:
          - "&c背包空间不足，无法安全移动锅内物品。"

  # Custom cooking pot recipe detail GUIs. Key must match behavior.custom.id.
  # If a custom pot has no matching entry here, the plugin falls back to
  # recipe-detail-cooking-pot and logs a console warning once per custom id.
  recipe-detail-cooking-pot-guis: {}

  # Example:
  # recipe-detail-cooking-pot-guis:
  #   custom:
  #     title: "<white><offset><icon><shift:-1600>Custom Pot Recipe"
  #     rows: 6
  #     title-layout:
  #       craftengine:
  #         offset: "<shift:-8>"
  #         icon: "<image:farmersdelight:cooking_pot_menu>"
  #     layout:
  #       - "BXXXXXXPX"
  #       - "XXXIIIGXX"
  #       - "XXXIIIXXX"
  #       - "XXXIIIXXX"
  #       - "XXXXXCXRX"
  #       - "XXXXXXXXX"
  #     legend:
  #       R: result
  #       I: ingredient
  #       C: container
  #       B: back
  #       P: fill
  #       G: progress
  #       X: background
  #     items:
  #       background:
  #         material: GRAY_STAINED_GLASS_PANE
  #         item_model: "air"
  #         hide-tooltip: true
  #         name: " "
  #       back:
  #         material: ARROW
  #         name: "Back"
  #       fill:
  #         material: HOPPER
  #         name: "Fill Ingredients"

  recipe-detail-cutting-board:
    title: "<white><offset><icon><shift:-1600>配方详细"
    rows: 6
    title-layout:
      craftengine:
        offset: "<shift:-1>"
        icon: "<image:farmersdelight:cutting_board_menu>"
    layout:
      - "BXXXXXXXX"
      - "XXXXXXXXX"
      - "XIXTXRRXX"
      - "XXXXXRRXX"
      - "XXXXXXXXX"
      - "XXXXXXXXX"
    legend:
      I: input
      R: result
      T: tool
      B: back
      X: background
    items:
      background:
        material: LIGHT_GRAY_STAINED_GLASS_PANE
        item_model: "air"
        hide-tooltip: true
        name: " "
      back:
        material: ARROW
        item_model: "air"
        name: "返回"

# 厨锅配方编辑器界面。/fd recipe edit pot <id> [组] 打开。
# 槽位文本与材质均在此配置,代码不写死。动态数值用占位符:
# info: {recipe_id} {type}; result-count: {count}; cook-time: {cook_time} {seconds};
# experience: {experience}; priority: {priority}; category: {category}
recipe-editor-gui:
  title: "<white>厨锅配方编辑器"
  rows: 6
  layout:
    - "####i####"
    - "#III#C#R#"
    - "#III###N#"
    - "#########"
    - "#T#E#P#G#"
    - "X###D###S"
  legend:
    i: info
    I: ingredient
    C: container
    R: result
    N: result-count
    T: cook-time
    E: experience
    P: priority
    G: category
    X: cancel
    D: delete
    S: save
    "#": background
  items:
    background:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      item_model: "air"
      hide-tooltip: true
      name: " "
    info:
      material: KNOWLEDGE_BOOK
      name: "&a厨锅配方: &f{recipe_id}"
      lore:
        - "&7类型: &f{type}"
        - "&7点击背包物品 → 复制到光标。"
        - "&7光标有物点槽位 → 放入;空光标点已填槽 → 取回(清空)。"
        - "&7数值槽: 左键 +,右键 -。"
        - "&7原料槽 Shift 点击: 标签/或选/排除(后续支持)。"
        - "&7背包物品不会被消耗。"
    ingredient:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7原料 &8(空)"
      lore:
        - "&7从光标放入一个物品作为原料。"
    container:
      material: GRAY_STAINED_GLASS_PANE
      name: "&b容器 &8(可选)"
      lore:
        - "&7随成品返还的碗/瓶等。"
    result:
      material: GRAY_STAINED_GLASS_PANE
      name: "&a成品 &8(空)"
      lore:
        - "&7本配方产出的物品。"
    result-count:
      material: PAPER
      name: "&e成品数量: &f{count}"
      lore:
        - "&7左键 &f+1 &7/ 右键 &f-1"
    cook-time:
      material: CLOCK
      name: "&e烹饪时间: &f{cook_time} &7tick ({seconds}s)"
      lore:
        - "&7左键 &f+20 &7(Shift &f+100&7)"
        - "&7右键 &f-20 &7(Shift &f-100&7)"
    experience:
      material: EXPERIENCE_BOTTLE
      name: "&e经验: &f{experience}"
      lore:
        - "&7左键 &f+0.1 &7(Shift &f+1.0&7)"
        - "&7右键 &f-0.1 &7(Shift &f-1.0&7)"
    priority:
      material: COMPARATOR
      name: "&e优先级: &f{priority}"
      lore:
        - "&7左键 &f+1 &7/ 右键 &f-1"
    category:
      material: BOOK
      name: "&e分类: &f{category}"
      lore:
        - "&7点击切换分类。"
    save:
      material: LIME_CONCRETE
      name: "&a保存"
      lore:
        - "&7写入配方文件并重载。"
    cancel:
      material: BARRIER
      name: "&c取消"
      lore:
        - "&7放弃修改并关闭。"
    delete:
      material: LAVA_BUCKET
      name: "&4删除配方"
      lore:
        - "&7从配方文件中移除该配方。"

# 自定义厨锅(大锅)编辑器界面覆盖。键名必须等于 behavior.custom.id。
# 缺省时回退到 recipe-editor-gui,并在控制台告警一次。
# 自定义锅可在此把 ingredient 槽扩展到更多个,以容纳更多原料。
recipe-editor-cooking-pot-guis: {}

# 删除配方确认页。点击编辑器的删除按钮时打开。
# info: {recipe_id}
recipe-editor-confirm-delete-gui:
  title: "<white>确认删除"
  rows: 3
  layout:
    - "####i####"
    - "##C###X##"
    - "#########"
  legend:
    i: info
    C: confirm
    X: cancel
    "#": background
  items:
    background:
      material: LIGHT_GRAY_STAINED_GLASS_PANE
      item_model: "air"
      hide-tooltip: true
      name: " "
    info:
      material: PAPER
      name: "&c删除配方: &f{recipe_id} ?"
      lore:
        - "&7此操作不可撤销。"
        - "&7点击左侧确认,或右侧取消。"
    confirm:
      material: RED_CONCRETE
      name: "&4确认删除"
      lore:
        - "&c从配方文件中永久删除该配方。"
    cancel:
      material: LIME_CONCRETE
      name: "&a取消"
      lore:
        - "&7返回编辑器,不删除。"

# 砧板配方编辑器界面。/fd recipe edit board <id> 打开。
# info: {recipe_id}; result-count: {count}; result-chance: {chance}; priority: {priority}
recipe-cutting-board-editor-gui:
  title: "<white>砧板配方编辑器"
  rows: 6
  layout:
    - "####i####"
    - "#N#T#T#T#"
    - "#########"
    - "#RRRRRRR#"
    - "#K#H#P###"
    - "X###D###S"
  legend:
    i: info
    N: input
    T: tool
    R: result
    K: result-count
    H: result-chance
    P: priority
    X: cancel
    D: delete
    S: save
    "#": background
  items:
    background:
      material: GRAY_STAINED_GLASS_PANE
      item_model: "air"
      hide-tooltip: true
      name: " "
    info:
      material: KNOWLEDGE_BOOK
      name: "&a砧板配方: &f{recipe_id}"
      lore:
        - "&7点击背包物品 → 复制到光标,点槽位放入。"
        - "&7N=输入物 T=工具 R=产物。"
        - "&7左键产物=选中(可调数量/概率),右键=清空。"
        - "&7工具全空时使用默认刀具标签。"
        - "&7背包物品不会被消耗。"
    input:
      material: GRAY_STAINED_GLASS_PANE
      name: "&7输入物 &8(空)"
      lore:
        - "&7被切割处理的物品。"
    tool:
      material: GRAY_STAINED_GLASS_PANE
      name: "&b工具 &8(空)"
      lore:
        - "&7放入一个工具物品。"
        - "&7全部留空 = 使用默认刀具标签。"
    result:
      material: GRAY_STAINED_GLASS_PANE
      name: "&a产物 &8(空)"
      lore:
        - "&7左键放入/选中,右键清空。"
    result-count:
      material: PAPER
      name: "&e所选产物数量: &f{count}"
      lore:
        - "&7左键 &f+1 &7/ 右键 &f-1"
        - "&7先左键选中一个产物槽。"
    result-chance:
      material: GOLD_NUGGET
      name: "&e所选产物概率: &f{chance}"
      lore:
        - "&7左键 &f+0.05 &7/ 右键 &f-0.05"
        - "&7先左键选中一个产物槽。"
    priority:
      material: COMPARATOR
      name: "&e优先级: &f{priority}"
      lore:
        - "&7左键 &f+1 &7/ 右键 &f-1"
    save:
      material: LIME_CONCRETE
      name: "&a保存"
      lore:
        - "&7写入配方文件并重载。"
    cancel:
      material: BARRIER
      name: "&c取消"
      lore:
        - "&7放弃修改并关闭。"
    delete:
      material: LAVA_BUCKET
      name: "&4删除配方"
      lore:
        - "&7从配方文件中移除该配方。"
