# FarmersDelight GUI configuration
# Interface layout, buttons, titles and textures are configured in this file.
# Each GUI's layout uses characters for slots, and legend maps characters to slot types.
# Each button under items can use material (vanilla material) or item (CraftEngine item).
# Optional fields: name, lore, name-key, lore-keys, custom-model-data, item-model/item_model, hide-tooltip/hide_tooltip.

cooking-pot-gui:
  title: "<white><offset><icon><shift:-1600><lang:gui.cooking_pot.title>"
  fillers-enabled: true
  title-layout:
    craftengine:
      offset: "<shift:-5>"
      icon: "<image:farmersdelight:cooking_pot_gui>"
  rows: 3

  layout:
    - "XIIIXPXBX"
    - "RIIIXXXXX"
    - "XXHXXCXOX"

  legend:
    I: ingredient
    H: heat
    C: container
    P: progress
    B: buffer
    O: output
    R: recipe
    X: background

  items:
    background:
      material: GRAY_STAINED_GLASS_PANE
      item_model: "air"
      hide-tooltip: true
      name: " "
    heat-active:
      item: farmersdelight:cooking_pot_heated
    heat-inactive:
      item: farmersdelight:cooking_pot_not_heated
    progress:
      item: farmersdelight:cooking_time
      name: "<yellow><lang:gui.cooking_pot.progress_name>"
      lore:
        - "<gray><lang:'gui.cooking_pot.progress_lore':'<white>{time}'>"
    recipe:
      item: farmersdelight:recipe_book
      name: "<gold><lang:gui.cooking_pot.view_recipes>"
      lore:
        - "<gray><lang:gui.cooking_pot.view_recipes_lore>"

  progress-items:
    - item: farmersdelight:0
    - item: farmersdelight:1
    - item: farmersdelight:2
    - item: farmersdelight:3
    - item: farmersdelight:4
    - item: farmersdelight:5
    - item: farmersdelight:6
    - item: farmersdelight:7
    - item: farmersdelight:8
    - item: farmersdelight:9
    - item: farmersdelight:10
    - item: farmersdelight:11
    - item: farmersdelight:12
    - item: farmersdelight:13
    - item: farmersdelight:14
    - item: farmersdelight:15
    - item: farmersdelight:16
    - item: farmersdelight:17
    - item: farmersdelight:18
    - item: farmersdelight:19
    - item: farmersdelight:20

# Custom cooking pot GUIs. Key names match behavior.custom.id in the CE block behavior.
# When an id has no entry, the cooking-pot-gui above is used automatically.
cooking-pot-guis: {}

