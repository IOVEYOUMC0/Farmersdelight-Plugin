name: FarmersDelight
version: ${version}
main: com.huidu.farmersdelight.FarmersDelightPlugin
api-version: '1.21'
folia-supported: true
depend: [CraftEngine]
softdepend: [AuraSkills, UltimateAdvancementAPI]
authors:
  - HuiDu_OwO
description: CraftEngine 的农夫乐事（Farmer's Delight）扩展
permissions:
  farmersdelight.command:
    description: 允许使用主命令
    default: true
  farmersdelight.command.recipe:
    description: 允许查看配方
    default: true
  farmersdelight.use.cooking_pot:
    description: 允许使用烹饪锅
    default: true
  farmersdelight.use.stove:
    description: 允许使用炉灶
    default: true
  farmersdelight.use.skillet:
    description: 允许使用煎锅
    default: true
  farmersdelight.use.cutting_board:
    description: 允许使用砧板
    default: true
  farmersdelight.admin:
    description: 管理员权限
    default: op
  farmersdelight.*:
    description: 所有 FarmersDelight 权限
    default: op
    children:
      farmersdelight.command: true
      farmersdelight.command.recipe: true
      farmersdelight.use.cooking_pot: true
      farmersdelight.use.stove: true
      farmersdelight.use.skillet: true
      farmersdelight.use.cutting_board: true
      farmersdelight.admin: true
