# Paper plugin manifest. Replaces plugin.yml: a Paper plugin gets its own class loader, so a
# bundled library cannot be silently shared with (or overridden by) another plugin's copy, and
# dependency order is declared per dependency instead of guessed from depend/softdepend.
#
# join-classpath is true wherever this plugin resolves the dependency's classes itself (Class.forName or
# direct imports). Land plugins other than WorldGuard are not listed: their claim checks run inside
# CraftEngine's own AntiGriefLib provider.
# load: POSTWORLD is deliberate (the Paper default): onEnable touches worlds.

name: FarmersDelight
version: '${version}'
main: com.huidu.farmersdelight.FarmersDelightPlugin
bootstrapper: com.huidu.farmersdelight.FarmersDelightBootstrap
api-version: '1.21.5'
folia-supported: true
description: CraftEngine port of Farmer's Delight by vectorwing (MIT).
authors:
  - HuiDu_OwO
website: https://github.com/IOVEYOUMC0/Farmersdelight

# The /farmersdelight command is registered through Paper's lifecycle API in onEnable:
# paper-plugin.yml has no commands: section.
dependencies:
  server:
    CraftEngine:
      # AFTER, not BEFORE: CraftEngine dispatches the claimed pack sections while it loads packs in
      # its own onEnable, so a plugin enabled before CraftEngine reads an empty claim and reports
      # "0 recipes" until a reload. Loading after CraftEngine still runs before that onEnable, so the
      # pack release and the claims made in onLoad are complete by the time CraftEngine scans for them.
      load: AFTER
      required: true
      join-classpath: true
    AuraSkills:
      load: BEFORE
      required: false
      join-classpath: true
    UltimateAdvancementAPI:
      load: BEFORE
      required: false
      join-classpath: true
    PlaceholderAPI:
      load: BEFORE
      required: false
      join-classpath: true
    # Declared in the dependency graph on purpose: MMOItems resolves over the class loader only when it is a
    # (transitive) dependency, and the item-id bridge looks its classes up reflectively.
    MMOItems:
      load: BEFORE
      required: false
      join-classpath: true
    WorldGuard:
      load: BEFORE
      required: false
      join-classpath: true

permissions:
  farmersdelight.command:
    description: Allow to use main command
    default: true
  farmersdelight.command.recipe:
    description: Allow to check the recipe
    default: true
  farmersdelight.command.recipe.discovery:
    description: Allow to unlock the recipe
    default: op
  farmersdelight.use.cooking_pot:
    description: Allow to use the Cooking Pot
    default: true
  farmersdelight.use.stove:
    description: Allow to use the Stove
    default: true
  farmersdelight.use.skillet:
    description: Allow to use the Skillet
    default: true
  farmersdelight.use.cutting_board:
    description: Allow to use the Cutting Board
    default: true
  farmersdelight.admin:
    description: Admin permissions
    default: op
  farmersdelight.*:
    description: All the FarmersDelight Plugin's permissions
    default: op
    children:
      farmersdelight.command: true
      farmersdelight.command.recipe: true
      farmersdelight.command.recipe.discovery: true
      farmersdelight.use.cooking_pot: true
      farmersdelight.use.stove: true
      farmersdelight.use.skillet: true
      farmersdelight.use.cutting_board: true
      farmersdelight.admin: true
