# 使用小刀破坏草、成熟小麦、成熟水稻时额外掉落草秆。
straw-drops:
  short_grass:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2
  tall_grass:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2
  mature_wheat:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2
  mature_rice:
    drop: farmersdelight:straw
    min-amount: 1
    max-amount: 2

# 宠物食物。玩家右键对应实体时给予效果，可继续按同格式添加更多食物。
# 每个键都是物品 ID，支持 CraftEngine 物品和原版物品。
# 食物仅用于“手持吸引”而不用于右键消耗时，可把 restore-health 设为 false、effects 写 []，并按需保留或关闭 sound/particles。
pet-foods:
  farmersdelight:dog_food:
    entities:
      - WOLF
    require-tamed: true
    restore-health: true
    effects:
      - type: SPEED
        duration: 6000
        amplifier: 0
        ambient: false
        particles: true
      - type: STRENGTH
        duration: 6000
        amplifier: 0
        ambient: false
        particles: true
    sound: ENTITY_GENERIC_EAT
    sound-volume: 0.8
    sound-pitch: 0.8
    particles: true
    particle-type: END_ROD
    particle-count: 5
  farmersdelight:horse_feed:
    # Bukkit EntityType 名称。可按同格式加入 LLAMA、CAMEL 等实体；写错会在日志中跳过。
    entities:
      - HORSE
      - DONKEY
      - MULE
    # true = 右键喂食时要求目标已经被驯服；false = 未驯服实体也能触发右键食物效果。
    require-tamed: false
    restore-health: true
    effects: []
    sound: ENTITY_GENERIC_EAT
    sound-volume: 0.8
    sound-pitch: 0.8
    particles: true
    particle-type: HEART
    particle-count: 4
    # 手持该食物时吸引上方 entities 中的实体靠近。
    tempt:
      # false = 该食物不参与手持吸引，只保留右键喂食效果。
      enabled: true
      # 吸引搜索半径，单位方块。
      range: 10.0
      # Pathfinder 移动速度倍率，太高会显得实体移动不自然。
      move-speed: 1.25
      # 吸引任务间隔，单位 tick。10 tick = 0.5 秒；调大可降低开销但响应会慢一些。
      tick-interval: 10
      # true = 已驯服且主人为喂食玩家的马不会被自己的马食继续拉扯。
      ignore-owned-tamed: true

# 舒适效果。默认关闭；开启后吃下列表食物会给玩家 Comfort。
