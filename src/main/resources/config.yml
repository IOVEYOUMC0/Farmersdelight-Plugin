# FarmersDelight configuration
# Common options come first. Edit gui.yml for GUI layout, buttons and textures.
# Item IDs support CraftEngine items and vanilla items, e.g. farmersdelight:flint_knife, minecraft:bowl.
# Optional item outputs can be set to "", none, null, empty, air, minecraft:air to clear them.

# Server log and console text language.
# Leave empty to follow the JVM/system language; set zh_cn or en_us to force it.
# Affects plugin logs, console text and text with no player context; player GUI/messages still prefer the player client language.
language: ''

# Datapacks are server-wide when loaded from the primary world, so writing another copy into every
# Multiverse/resource/dungeon world only creates unused files. Entries are exact Bukkit world names.
# $primary resolves to server.properties level-name; * restores the old all-world behavior; [] disables writes.
datapacks:
  world-whitelist:
    - $primary

# Enchantments added by FarmersDelight. Knife and skillet enchantments are configured separately.
# Registry properties (weight, valid cost range, conflicts and anvil cost) are read from Paper at runtime;
# these lists only decide what each FarmersDelight item group may receive.
enchantments:
  enabled: true
  # Whether to install the built-in enchantment datapack (farmersdelight_enchant, contains the
  # backstabbing enchant definition + tag files). The datapack is copied into each whitelisted
  # world's datapacks/ folder and requires a server restart (or /reload) to take effect; admin
  # edits to already-installed files survive plugin updates. Set to false to skip the install
  # (e.g. when authoring the enchantment yourself). Reinstall via /fd reload enchant.
  install-datapack: true
  compatibility:
    # When another enchantment plugin is detected, stand down only FarmersDelight's custom backstab enchant so
    # we don't stack a second special enchant onto its system; the knife/skillet enchant filter itself stays on
    # (the CraftEngine knives are otherwise un-enchantable). Detection is automatic and needs no plugin list:
    # any plugin (other than CraftEngine, the required host) that hooks the enchanting table, or any enchantment
    # registered outside the minecraft:, farmersdelight: and craftengine: namespaces, counts. Set this to false
    # to force the backstab enchant on regardless.
    auto-disable-on-conflict: true

  groups:
    knives:
      table:
        enabled: true
        # true replaces the three offers with vanilla-style rolls from this group's list.
        # false keeps vanilla/other-plugin offers and appends a compatible configured roll.
        override-offers: true
        # Fallback enchantability for items without farmersdelight:sword settings in their CE YAML.
        default-enchantability: 12
        # $backstabbing resolves to backstabbing.id, so changing the custom ID needs no duplicate edits.
        enchantments:
          - minecraft:sharpness
          - minecraft:smite
          - minecraft:bane_of_arthropods
          - minecraft:unbreaking
          - minecraft:fire_aspect
          - minecraft:knockback
          - minecraft:looting
          - minecraft:fortune
          - $backstabbing
      # Anvil auto-inherits this group's table list and also allows mending.
      anvil:
        enabled: true

    skillet:
      table:
        enabled: true
        override-offers: true
        default-enchantability: 14
        enchantments:
          - minecraft:sharpness
          - minecraft:smite
          - minecraft:bane_of_arthropods
          - minecraft:unbreaking
          - minecraft:fire_aspect
          - minecraft:knockback
          - minecraft:looting
      # Anvil auto-inherits this group's table list and also allows mending.
      anvil:
        enabled: true

  backstabbing:
    enabled: true
    id: farmersdelight:backstabbing
    definition:
      # Cost/anvil_cost/slots are defined in the built-in datapack (datapack/enchantment/).
      weight: 5
      max-level: 3
    combat:
      players-only: true
      require-knife: true
      multiplier-base: 1.4
      multiplier-per-level: 0.2

# Debug logging. Off by default, not needed on a normal server.
# enabled=true is the master switch; an empty categories list outputs no per-category logs.
# Available categories and their purpose:
#   startup    - Boot sequence details (i18n, behaviors, tick manager, PAPI, advancements, datapack writes, etc.)
#   recipe     - Per-recipe-type load counts
#   loot       - Knife drop rule and loot injection details
#   cooking_pot - Cooking pot behavior
#   stove      - Stove behavior
#   skillet    - Skillet behavior
#   tray       - Tray behavior
#   gui        - GUI rendering
#   interact   - Player interaction events
#   config     - Config file integrity checks
#   resource   - Resource auto-completion details (+ added / = skipped)
# Set to ["all"] or ["*"] to temporarily enable every category.
debug:
  enabled: false
  categories: []

# Vanilla loot table injection. The plugin ships a built-in datapack (`farmersdelight_loot`)
# that overrides vanilla chest / mob drop / grass loot tables to inject FarmersDelight items
# via CraftEngine's `craftengine:item` loot pool entry type. The datapack is copied into each
# whitelisted world's `datapacks/` folder on first enable and requires a server restart (or /reload) to
# take effect. Once installed, admin edits to the datapack files survive plugin updates
# (already-present datapack folders are not overwritten). Set to false to skip the install
# (useful if you want to author your own loot tables manually or use another loot plugin).
loot-injection:
  install-datapack: true

# Vanilla damage-type injection (farmersdelight_damage datapack): the custom farmersdelight:stove_burn
# damage type used by the stove grilling surface, plus its no_knockback tag entry. Installed into each
# whitelisted world's datapacks/ folder and requires a server restart (or /reload) to take effect.
# Split from the loot datapack so the two can be toggled and reinstalled independently; old installs
# that wrote these files under the loot datapack are migrated (legacy files removed) on the next
# install. Reinstall via /fd reload damage.
damage-type:
  install-datapack: true

# Advancement system. When disabled, the built-in advancement datapack is not synced.
advancements:
  enabled: true
  # Hide advancements whose CraftEngine items/blocks were deleted from the CraftEngine configuration, and drop
  # the matching subtasks of multi-step advancements so they stay completable. Children of a hidden advancement
  # re-attach to the nearest visible ancestor; the tab root is never hidden. Gating is skipped entirely while the
  # CraftEngine registries are still empty, so a slow start never looks like deleted content.
  auto-disable-missing: true
  # Always keep these advancements visible, even when their CraftEngine content is missing.
  # Entries are the advancement id (master_chef) or tab-qualified (farmersdelight:master_chef).
  # A bare id applies to every registered tab, so prefer the tab-qualified form when addons add tabs.
  force-enable: []
  # Always hide these advancements. Beats force-enable and automatic detection.
  force-disable: []

# CraftEngine resource auto-completion.
# First startup always extracts the full built-in CraftEngine resources to CraftEngine/resources/farmersdelight.
# When auto-completion=true, every later startup also restores deleted/missing resource files.
# Set to false if you manually deleted some built-in configs and do not want them re-added (first extraction is unaffected).
craftengine-resources:
  auto-completion: true

# Recipe settings: which bundled recipes are written to disk, and how recipes are revealed in the books.
recipes:
  # Bundled recipe files.
  # A recipe file is only written when it is missing entirely, so recipes added by a plugin update never
  # reach a server that already has recipes/*.yml. On startup the ids that exist in the jar but not on
  # disk are listed once in the console.
  # merge-missing-bundled=true adds those ids back to the file. Leave it false if you deleted recipes on
  # purpose to disable them, because the merge would bring every deleted recipe back.
  # An id that already exists on disk is never overwritten under either setting.
  merge-missing-bundled: false

  # Recipe discovery: when enabled, recipes start LOCKED in the recipe books (FarmersDelight's own cooking-pot /
  # cutting-board viewer AND the addon recipe book) and are revealed per-player as they unlock them. Locking only
  # affects the books' display -- it never blocks actual crafting at a station. Off by default (books behave as before).
  discovery:
    enabled: false
    # How locked recipes appear in a book: 'placeholder' shows a locked icon; 'hidden' omits them until unlocked.
    locked-display: placeholder
    # Item id used for the 'placeholder' locked icon.
    locked-icon: BARRIER
    # Auto-unlock a recipe when the player obtains its result item or one of its exact (non-tag) ingredients.
    unlock-on-obtain: true
    # Send the player a chat message when a recipe unlocks.
    notify: true

# Global performance budget. Per-block tick budgets live in each block's config; this keeps cross-feature maintenance tasks.
performance:
  # Console performance warnings. Logs only, never blocks blocks from working.
  warnings-enabled: true
  warning-cooldown-seconds: 600

  # Warn when active plugin block count exceeds this value; only affects the warning threshold, not the actual tick queue capacity.
  active-block-warning-threshold: 1000
  cooking-pot-total-warning-threshold: 1000
  cooking-pot-density-warning-threshold: 64

  # Warn when CraftEngine server block states remaining drop below this value; set to 0 to warn only when fully exhausted.
  craftengine-free-state-warning-threshold: 32

  # Proxy ItemDisplay visibility sync interval and per-batch count. Affects near/far visibility maintenance of skillet/stove food displays.
  proxy-item-display-view-distance: 64.0
  proxy-item-display-sync-interval-ticks: 20
  proxy-item-display-sync-batch-size: 256

  # Max player/entity relationships processed per tick for pet food tempting.
  pet-tempt-tick-budget: 128

  # Max plugin block data entries reloaded per tick from already-loaded chunks during plugin startup.
  # Increase to shorten post-startup recovery time, decrease to ease startup-instant load.
  startup-chunk-loads-per-tick: 16

  # Hard cap on particle + sound packets a single chunk's cooking pots / skillets / stoves may emit in one
  # server tick. Prevents a dense pocket of heat blocks from flooding the packet queue. Lower on a struggling
  # server; the per-block emission chances (in each block's effects section) still gate individual visuals.
  chunk-effect-packet-budget: 50

  # How often (ticks) the Comfort / Nourishment effect task runs per tracked player: drives duration
  # countdown and the bossbar push. Higher = smoother CPU under many buffed
  # players at the cost of bar smoothness; durations self-correct since they decrement by this interval.
  effect-tick-interval-ticks: 4

# Master switch for the vanilla container bridge between hoppers and plugin blocks.
# When enabled=false, the hopper container bridge for plugin blocks is fully disabled, avoiding hoppers eating items, duplicate container creation or write errors.
# On by default; if you hit hopper compatibility issues, turn off the master switch first to troubleshoot.
# Whether each block allows hopper interaction is set in the cooking-pot / cutting-board / skillet sections.
hopper-interactions:
  enabled: true

# Cutting board interaction and item display on the board.
cutting-board:
  # true = when hopper-interactions.enabled is on, the cutting board allows hopper input/output.
  hopper-interactions: true

  # Cutting board interaction mode:
  # stacking = enable 64 stacking, disable offhand interaction
  # offhand  = enable offhand interaction, disable 64 stacking
  interaction-mode: stacking

  # true = only items with a cutting recipe or tools can be placed on the board, all others rejected; false = any item allowed (default).
  # Detection matches cutting/tool logic, compatible with vanilla and CraftEngine custom items.
  recipe-only-placement: false

  # true = a dispenser facing a cutting board uses the dispensed item as a cutting tool on the board's stored
  # item (results drop, the tool takes durability and is kept in the dispenser). A dispenser facing a board
  # never ejects its item. Set false to restore vanilla dispenser behavior in front of cutting boards.
  dispenser-behavior: true

  sounds:
    # Volume and pitch when retrieving a board item by hand.
    retrieve-volume: 0.25
    retrieve-pitch: 0.5

  # Global default offset for item display entities on the board, format x,y,z.
  # x/z control horizontal position, y controls height above the board surface.
  # After replacing the board model, adjust this if all items sit too far left/right or sink into the model.
  # Special positions for individual items should use display-overrides.
  default-display-offset: 0,-0.03,0
  # You can also set a global default transformation as needed. rotation overrides the automatic facing, usually only used when the whole model orientation needs redoing.
  # default-display-translation: 0,0,0
  # default-display-rotation: 90,180,0
  # default-display-scale: 0.6

  # Random spread range when multiple items stack on the board.
  # 0.15 means x/z up to about +/-0.075 block, close to the original mod's look.
  # Decrease if food looks too scattered, e.g. 0.08; increase to show stacking layers, e.g. 0.20.
  display-item-spread: 0.1

  # Override the board display for a specific item.
  # key is the item ID stored on the board, which can be minecraft:* or a CraftEngine item ID.
  # display-item: use another item as the display model, good when the original model renders incorrectly in an ItemDisplay.
  # style: auto detects automatically; item forces a flat item; block forces a block/3D item.
  # position: extra offset on top of the global default-display-offset, format x,y,z.
  # translation: internal translation of the ItemDisplay transformation. Usually leave default, adjust only when the model's own pivot is off.
  # rotation: directly override the display rotation angles, format x,y,z in degrees.
  # scale: directly override the scale, format x,y,z; can also be a single number such as 0.55.
  # Example:
  # display-overrides:
  #   farmersdelight:tomato:
  #     display-item: farmersdelight:tomato_display
  #     style: item
  #     position: 0,0.02,0
  #     translation: 0,0,0
  #     rotation: 90,180,0
  #     scale: 0.55
  display-overrides:
    farmersdelight:stove:
      style: block
    farmersdelight:cooking_pot:
      style: block
    farmersdelight:cutting_board:
      style: block
    farmersdelight:skillet:
      style: block
      rotation: -90,90,0
      position: 0,-0.225,0
    farmersdelight:basket:
      style: block
    farmersdelight:tray:
      style: block
    # 3D blocks whose item icon is 2D (item/generated parent in the vanilla model) — placed on the board
    # they read as flat sprites instead of awkward floating meshes. Unknown ids are ignored silently
    # (CuttingBoardDisplayConfig validates only the namespace:id format, never material existence), so
    # listing newer-version items stays safe on older servers — e.g. pale_oak_sapling on 1.21.1.
    minecraft:torch:
      style: item
    minecraft:soul_torch:
      style: item
    minecraft:redstone_torch:
      style: item
    minecraft:lantern:
      style: item
    minecraft:soul_lantern:
      style: item
    minecraft:end_rod:
      style: item
    minecraft:lightning_rod:
      style: item
    minecraft:chain:
      style: item
    minecraft:hopper:
      style: item
    minecraft:cauldron:
      style: item
    minecraft:brewing_stand:
      style: item
    minecraft:campfire:
      style: item
    minecraft:soul_campfire:
      style: item
    minecraft:cake:
      style: item
    minecraft:conduit:
      style: item
    minecraft:end_portal_frame:
      style: item
    minecraft:flower_pot:
      style: item
    minecraft:ladder:
      style: item
    minecraft:scaffolding:
      style: item
    minecraft:tripwire_hook:
      style: item
    minecraft:cobweb:
      style: item
    minecraft:lily_pad:
      style: item
    minecraft:vine:
      style: item
    minecraft:weeping_vines:
      style: item
    minecraft:twisting_vines:
      style: item
    minecraft:hanging_roots:
      style: item
    minecraft:nether_wart:
      style: item
    minecraft:nether_sprouts:
      style: item
    minecraft:crimson_roots:
      style: item
    minecraft:warped_roots:
      style: item
    minecraft:crimson_fungus:
      style: item
    minecraft:warped_fungus:
      style: item
    minecraft:dead_bush:
      style: item
    minecraft:short_grass:
      style: item
    minecraft:tall_grass:
      style: item
    minecraft:fern:
      style: item
    minecraft:large_fern:
      style: item
    minecraft:sugar_cane:
      style: item
    minecraft:kelp:
      style: item
    minecraft:sea_pickle:
      style: item
    minecraft:azalea:
      style: item
    minecraft:flowering_azalea:
      style: item
    minecraft:pink_petals:
      style: item
    minecraft:glow_lichen:
      style: item
    minecraft:sculk_vein:
      style: item
    minecraft:oak_sapling:
      style: item
    minecraft:spruce_sapling:
      style: item
    minecraft:birch_sapling:
      style: item
    minecraft:jungle_sapling:
      style: item
    minecraft:acacia_sapling:
      style: item
    minecraft:dark_oak_sapling:
      style: item
    minecraft:cherry_sapling:
      style: item
    minecraft:pale_oak_sapling:
      style: item
    minecraft:mangrove_propagule:
      style: item
    minecraft:bamboo_sapling:
      style: item
    minecraft:firefly_bush:
      style: item
  # Batch-override displays by item tag. key may omit #, or use a quoted "#namespace:tag" in display-overrides.
  display-tag-overrides:
    # Vanilla item tags that cover whole families of 3D-block-with-2D-item entries — saves listing every
    # wood/colour variant individually. Unknown tags are ignored at lookup, so versions that lack a tag
    # just won't apply the override.
    minecraft:doors:
      style: item
    minecraft:beds:
      style: item
      rotation: -90,-90,0
      position: 0,0.05,0
    minecraft:banners:
      style: item
    minecraft:signs:
      style: item
    minecraft:hanging_signs:
      style: item
    minecraft:rails:
      style: item
    minecraft:small_flowers:
      style: item
    minecraft:tall_flowers:
      style: item
  # Example:
  # display-tag-overrides:
  #   minecraft:logs:
  #     style: block
  #     scale: 0.55

# Knife detection. Recommended to keep both tags and explicit items: tags for CE resource-side extension, explicit items as a fallback.
# This is the knife definition for the whole plugin, not only for drops: the cutting board, the skillet,
# mushroom colony harvesting, rice harvesting, straw drops, the knife icon in the recipe viewer and the
# knife achievements all read it, as do addon drop rules registered without their own tool list.
knife-items:
  tags:
    - farmersdelight:knives
  items:
    - farmersdelight:flint_knife
    - farmersdelight:iron_knife
    - farmersdelight:golden_knife
    - farmersdelight:diamond_knife
    - farmersdelight:netherite_knife

# Extra drops that knives (and other configured tools) produce.
drops:
  # Default trigger tools for mob extra drops. Only affects drops.mob-extra below, does not treat these items as knives.
  # items can be any minecraft:* or CraftEngine item ID; tags can be vanilla/CraftEngine item tags.
  # For example, to let an iron sword also trigger mob extra drops, add minecraft:iron_sword under items.
  mob-extra-tools:
    tags:
      - farmersdelight:knives
    items:
      - farmersdelight:flint_knife
      - farmersdelight:iron_knife
      - farmersdelight:golden_knife
      - farmersdelight:diamond_knife
      - farmersdelight:netherite_knife

  # Extra drops when killing an adult mob with a tool configured in drops.mob-extra-tools.
  # normal is the regular drop, burning is the drop when the target is on fire, chance is the base probability, looting-multiplier is the added probability per looting level.
  # Each rule may use tool-item / tool-items / tool-tags to override the trigger tools; otherwise drops.mob-extra-tools is used.
  # Example: tool-item: minecraft:iron_sword means this rule triggers only when an iron sword kills the mob.
  mob-extra:
    pig:
      normal: farmersdelight:ham
      burning: farmersdelight:smoked_ham
      chance: 0.5
      looting-multiplier: 0.1
    hoglin:
      normal: farmersdelight:ham
      burning: farmersdelight:smoked_ham
      chance: 1.0
      looting-multiplier: 0.0
    cow:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    mooshroom:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    donkey:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    horse:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    mule:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    llama:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    trader_llama:
      normal: minecraft:leather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    chicken:
      normal: minecraft:feather
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    spider:
      normal: minecraft:string
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    cave_spider:
      normal: minecraft:string
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    rabbit:
      normal: minecraft:rabbit_hide
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0
    shulker:
      normal: minecraft:shulker_shell
      burning: ""
      chance: 1.0
      looting-multiplier: 0.0

  # Extra straw drops when breaking grass, mature wheat or mature rice with a knife.
  # Ownership split: the straw ITEM for short_grass / tall_grass / mature_wheat is dropped by the
  # CraftEngine vanilla loot entries in craftengine/farmersdelight/configuration/vanilla_loots.yml,
  # which also carry the 0.2 grass chance; the plugin listener deliberately does not drop straw a
  # second time for those three blocks, it only awards the harvest_straw advancement there. So for
  # those three the drop / min-amount / max-amount values below are inert and only mature_rice, plus
  # any extra block key added here, is dropped by the listener itself.
  straw:
    short_grass:
      drop: farmersdelight:straw
      min-amount: 1
      max-amount: 1
    tall_grass:
      drop: farmersdelight:straw
      min-amount: 1
      max-amount: 1
    mature_wheat:
      drop: farmersdelight:straw
      min-amount: 1
      max-amount: 1
    mature_rice:
      drop: farmersdelight:straw
      min-amount: 1
      max-amount: 1

# Cooking pot configuration. Configure custom pot slots and GUI in the CraftEngine block behavior and gui.yml.
cooking-pot:
  cooking:
    # Default cook time used when a recipe has no cooking_time / cooking-time / cook-time.
    default-cook-time: 200
    # Safe lower/upper bounds for all pot recipe cook times, to prevent accidental 0 or huge values.
    min-cook-time: 20
    max-cook-time: 6000

  # Max active cooking pots processed every 4 ticks. Increase for faster response, decrease for stability under stress tests.
  tick-budget: 512

  # true = when hopper-interactions.enabled is on, the pot allows hopper input/output.
  hopper-interactions: true

  # true = pack pot contents into the dropped pot item; false = drop an empty pot and scatter the contents.
  pack-contents-on-break: true

  # Milliseconds a player must wait after placing a pot before the placing click can also open it. Stops the
  # placement click from carrying straight through into the GUI. Set to 0 to allow opening immediately.
  place-interaction-cooldown-ms: 1000

  display:
    # How often (ticks) the pot re-checks which players should see its displays. Raise it to trade display
    # responsiveness for fewer visibility checks on servers with very many pots.
    visibility-check-interval-ticks: 100

  # Floating TextDisplay during pot cooking.
  progress-display:
    # false = fully disable the pot cooking progress TextDisplay. Off by default (little value, and the packet displays add overhead); set true to re-enable.
    enabled: false

    # false shows only progress/status; true also shows the name of the recipe being cooked.
    show-recipe-name: false

    # TextDisplay height relative to the bottom of the pot block.
    # After swapping to a tall or short pot model, adjust this if the text sinks into the pot or floats too high.
    y-offset: 1.2

    # TextDisplay scale. Only affects the floating progress text, not the GUI.
    scale: 0.5

    # How many blocks away a player can possibly see the progress text.
    # On Paper, the player must also look at the pot; on Folia, to avoid cross-region display control, it is visible directly by default.
    visibility-distance: 10.0

    # Dot product threshold between the player's line of sight and the pot direction. Closer to 1 requires more precise aiming.
    # 0.95 roughly means the player must clearly look at the pot; lower to 0.90 if the hint is too hard to trigger.
    look-dot-threshold: 0.95

    # Refresh interval of the floating progress text. Only affects TextDisplay update frequency, never slows the pot's real cook time.
    update-interval-ticks: 8

    # Auto-disable the floating TextDisplay when active pot count exceeds this value; 0 = do not auto-disable by count.
    disable-above-active-pots: 512

  # Player-installed bail handle decoration. Toggled via shift + empty-hand right-click on a cooking
  # pot. Mirrors the tray configuration shape: change the handle furniture ID here if you renamed it
  # on the resource pack side, or to swap in a custom handle variant.
  handle:
    # CraftEngine handle furniture ID. Must be updated here too if renamed on the resource side.
    handle-block-id: farmersdelight:cooking_pot_handle
    # Handle marker key. Not recommended to change for an already-placed world; old handles cannot be
    # recognized as auto handles after changing it.
    marker-key: auto_pot_handle
    # Handle anchor offset relative to the pot block, mirroring the tray block. Defaults centre the
    # handle horizontally over the pot; the CE handle definition's element {position: 0, 0.5, 0}
    # then puts the visible bail at the pot's mid-height where its arc extends up over the rim.
    # Tweak when you swap in a custom handle furniture model with a different anchor.
    x-offset: 0.5
    y-offset: 0.0
    z-offset: 0.5
    # Feedback sound played to the player when toggling the handle on/off. Set volume to 0 to silence it.
    toggle-sound: "minecraft:block.lantern.place"
    toggle-sound-volume: 0.7
    toggle-sound-pitch: 1.0

  # Cooking pot world particle effects.
  effects:
    # How many blocks away a player must be for the pot to broadcast its particles/sounds. 32 = vanilla
    # particle/sound range. Lower it to shrink the broadcast radius for dense pot farms (matches stove.effects.viewer-distance).
    viewer-distance: 32.0
    # Emit particles/sounds only every Nth cooking-pot tick pass (a pass runs every 4 server ticks, so 1 =
    # ~5 emissions/second). Raise to 2 or 3 to roughly halve/third the particle + getPlayersSeeingChunk cost
    # for dense pot farms; cooking speed/progress is unaffected. 1 = every pass (default, smoothest visuals).
    interval: 1
    bubble:
      enabled: true
      type: BUBBLE_POP
      chance: 0.20
      count: 1
      y-offset: 0.02
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      speed: 0.01
    steam:
      enabled: true
      type: CLOUD
      chance: 0.05
      count: 1
      y-offset: 0.08
      offset-x: 0.0
      offset-y: 0.03
      offset-z: 0.0
      speed: 0.02
      secondary:
        enabled: false
        type: SMOKE
        count: 1
        y-offset: 0.05
        offset-x: 0.0
        offset-y: 0.025
        offset-z: 0.0
        speed: 0.02

# How recipe experience is settled when a station hands a finished result to the player.
# vanilla = drop vanilla experience orbs; auraskills = only grant AuraSkills experience; both = both; none = no experience reward.
# Base experience is still decided by each recipe's experience field in recipes/cooking_pot_recipes.yml.
# Applies to the cooking pot and to every addon station that credits experience through the FarmersDelight API,
# such as the Brewin' and Chewin' keg, so setting none here silences those addons too.
experience-reward:
  mode: vanilla

  # Applies when mode is auraskills or both. Skill ID can be farming, auraskills/farming, or namespace/custom_skill.
  # multiplier uses "recipe experience x multiplier" as AuraSkills experience; if amount is set, instead gives a fixed amount per pickup.
  # raw=false goes through AuraSkills' own multipliers/modifiers; raw=true adds raw experience directly.
  auraskills:
    skill: farming
    multiplier: 1.0
    raw: false

# Tray furniture auto-placed under a station, used to carry the CE display effect.
# Owned by the cooking pot and the skillet alike: enabled: false removes auto trays from both.
tray:
  # true = ensure a tray exists below when opening/syncing the pot or placing a skillet; false = no auto tray, contents display may be incomplete.
  enabled: true

  # CraftEngine tray block/furniture ID. Must be updated here too if renamed on the resource side.
  tray-block-id: farmersdelight:tray

  # Tray offset relative to the station block coordinates, usually no need to change.
  x-offset: 0.5
  y-offset: -1.0
  z-offset: 0.5

  # true = only auto-place the tray when the support block is not a full block, to avoid covering normal solid blocks.
  # CraftEngine custom heat sources bypass this limit; used to support model blocks like the stove.
  require-non-full-support: true
  # Tray batch sync interval and per-batch count. sync-batch-size also limits the urgent tray sync triggered by support block changes / stress-test batch activation.
  # Increase the interval or decrease the batch when TPS is tight.
  sync-interval-ticks: 100
  sync-batch-size: 32
  # On Paper, an extra interval for scanning marked trays, used to recover/clean up auto trays after restart or chunk reload.
  # Default 1200 ticks = 60 seconds; set to 0 to scan every tray sync round, useful temporarily when troubleshooting trays.
  # On Folia, to avoid cross-region entity scanning, no world-wide tray scan is performed.
  marked-tray-scan-interval-ticks: 1200
  # Tray marker key. Not recommended to change for an already-placed world; old trays cannot be recognized as auto trays after changing it.
  marker-key: auto_tray_marker

# Return table after a station consumes container-type items.
# Key is the container item ID consumed, value is the item ID returned to the container slot / player inventory after use.
# For example, milk_bottle returns glass_bottle after being consumed. Set a value to "" to disable that return.
# Read by the cooking pot and by the shared remainder helper the API exposes to addon stations.
container-returns:
  farmersdelight:milk_bottle: minecraft:glass_bottle

# Heat source detection. Used by both the pot and the skillet; the skillet's hopper heat conduction can be disabled separately.
heat-sources:
  # CraftEngine custom block tags. A block with this tag in its CE block config is treated as a heat source.
  tags:
    - farmersdelight:heat_sources
  # Vanilla block IDs.
  vanilla-blocks:
    - minecraft:magma_block
    - minecraft:lava_cauldron
    - minecraft:lava
    - minecraft:fire
    - minecraft:soul_fire

  # Vanilla block tags. minecraft:campfires accepts only lit campfires.
  vanilla-tags:
    - minecraft:campfires

  # CraftEngine custom block IDs, with optional state conditions.
  # Format example: namespace:block or namespace:block[key:value,key2:value2]
  custom-blocks:
    - farmersdelight:stove[fire:true]

  # Vanilla heat-conducting blocks. The pot can find a heat source through these blocks.
  conductors:
    - minecraft:hopper

  # CraftEngine heat-conducting block tags.
  conductor-tags: []

# Mushroom colony block placement rules. Growth speed, age and drops are still configured in CraftEngine mushrooms.yml.
mushroom-colonies:
  placement:
    # These support blocks ignore the light limit and always allow mushroom colony placement.
    always-valid-supports:
      - minecraft:mycelium
      - minecraft:podzol
      - minecraft:crimson_nylium
      - minecraft:warped_nylium
      - minecraft:mushroom_stem
    # true = other full solid blocks also allow placement under low light.
    allow-solid-supports-below-max-light: true
    # When the block above is not in always-valid-supports, placement is allowed only if the target light is at or below this value.
    max-light: 12

# Rope block behavior.
rope:
  # How many blocks up a rope column is searched for a bell when right-clicked with an empty hand.
  # The search stops early at any gap or non-rope block. Minimum 1.
  bell-ring-max-distance: 24

# Skillet configuration.
skillet:
  # true = when hopper-interactions.enabled is on, the skillet allows hopper ingredient input; results still pop out directly per the original mod behavior, with no hopper output slot.
  hopper-interactions: true

  # Max active skillets processed every 4 ticks.
  tick-budget: 512

  cooking:
    # Default cook time used when a vanilla campfire recipe has no cooking time.
    default-cook-time: 600
    # The skillet multiplies the campfire recipe time by the multiplier below; this caps how low (in ticks) it can go.
    min-cook-time: 60
    # Skillet cook time multiplier. 0.2 means about 20% of the vanilla campfire time.
    cook-time-multiplier: 0.2
    # When placing a skillet with Fire Aspect, the extra multiplier subtracted from cook-time-multiplier per Fire Aspect level.
    fire-aspect-bonus: 0.05
    # How much cooking progress reverts per tick when the skillet loses its heat source; set to 0 for no revert.
    cooling-decrement: 2

  heat:
    # true = the skillet also takes heat from a source one block further down, through a conductor listed in
    # heat-sources.conductors (a hopper). This matches the original mod, whose skillet does not require direct
    # heat, so it is on by default. Set to false to make the skillet accept only a heat source directly below.
    allow-conductors: true

  effects:
    # How many blocks away a player must be for the skillet to broadcast its particles/sounds. 32 = vanilla
    # particle/sound range. Lower it to shrink the broadcast radius for dense skillet farms (matches stove.effects.viewer-distance).
    viewer-distance: 32.0
    smoke:
      enabled: true
      type: SMOKE
      chance: 0.10
      count: 2
      y-offset: 0.2
      offset-x: 0.1
      offset-y: 0.1
      offset-z: 0.1
      speed: 0.02
    sizzle:
      enabled: true
      chance: 0.03
      volume: 0.5
      pitch: 1.0

  display:
    # Scale of food displayed in the skillet. After swapping the model, adjust this first if food is too big or too small.
    scale: 0.5
    # Supports the same position/translation/rotation/scale/display-overrides/display-tag-overrides as the cutting board.
    # rotation overrides the automatic facing; for per-item or per-tag tweaks, prefer writing them in overrides.
    # rotation: 90,0,0
    # Base height of the food display entity, about 0.1 in the original mod.
    # If food sinks into the skillet, raise it slightly; if it floats noticeably, lower it slightly.
    y-offset: 0.1
    # Random spread range of multiple foods on the skillet.
    # About 0.15 in the original mod, i.e. up to about +/-0.075 block.
    # If the x/z horizontal spread is too large, lower this value first.
    item-spread: 0.15
    # display-overrides: {}
    # display-tag-overrides: {}

# Stove configuration.
stove:
  # Max active stoves processed every 4 ticks.
  tick-budget: 512

  cooking:
    # Default cook time used when a vanilla campfire recipe has no cooking time.
    default-cook-time: 600
    # How much cooking progress reverts per tick when the stove goes out; set to 0 for no revert.
    cooling-decrement: 2

  # A lit stove burns living entities standing on its central grilling area. Burn damage/type is on the
  # CraftEngine stove block; this only bounds the always-on poll.
  burn:
    # Radius (blocks) around each online player scanned for mobs to burn. Lower on high-population servers
    # to shrink the per-player entity scan; also limits how far away mobs get grilled.
    mob-scan-radius: 12.0

  effects:
    # How many blocks away a player must be for the stove to broadcast its particles/sounds. 32 = vanilla
    # particle/sound range. Lower it to shrink the broadcast radius for dense stove farms.
    viewer-distance: 32.0
    smoke:
      enabled: true
      type: SMOKE
      # Emitted every dispatch (every 4 ticks) per lit stove when a player is near. Now that stoves
      # emit uniformly (no chunk stagger), these chances are the true per-stove rate — previously a
      # broken stagger meant only ~1/4 of stoves emitted, so the shipped values were ~4× higher.
      chance: 0.05
      count: 1
      y-offset: 0.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      speed: 0.02
    crackle:
      enabled: true
      chance: 0.0125
      volume: 1.0
      pitch: 1.0
    fire:
      enabled: true
      chance: 0.125

  display:
    # Scale of food displayed on the stove.
    scale: 0.375
    # Supports the same position/translation/rotation/scale/display-overrides/display-tag-overrides as the cutting board.
    # position is added to each slot offset; rotation overrides the automatic facing.
    # rotation: 90,0,0
    # Default offsets of the stove's 6 food display slots, format x,y,z.
    # Coordinates are based on north facing: x left/right, y height, z front/back; the plugin auto-rotates by stove facing.
    # After switching to another stove model, you usually only need to adjust this if food is not on the cooking surface.
    # Slot order is front row right/center/left, back row right/center/left (viewed from north).
    slot-offsets:
      - "0.3,1.02,0.2"
      - "0.0,1.02,0.2"
      - "-0.3,1.02,0.2"
      - "0.3,1.02,-0.2"
      - "0.0,1.02,-0.2"
      - "-0.3,1.02,-0.2"
    # display-overrides: {}
    # display-tag-overrides: {}

# Buff system. Master switch for every custom buff: Comfort, Nourishment and any buff an addon registers
# through the buff API.
# enabled=false turns the whole system off — no buff is applied or ticked, the effect ticker never starts,
# nothing is shown on any display channel, and the /fd buff subcommand is hidden from help and
# tab-completion and rejected when typed. Addon API calls stay safe no-ops, so an addon keeps working.
# buff.display.enabled below is the narrower switch: it only silences the display while the effects
# themselves keep being applied and ticked.
buff:
  enabled: true

  # Buff persistence. Comfort / Nourishment remaining time is mirrored into player PDC on quit and
  # restored on join, so the buff survives relog / restart (and rides whole-PDC sync plugins like
  # HuskSync / MySQLPlayerDataBridge across a proxy network). Because those sync plugins apply the
  # synced PDC a moment AFTER join, the restore is retried once this many ticks later — gap-filling,
  # so it never overwrites a buff gained since join. Set to 0 to skip the retry (single-server only).
  persistence:
    restore-retry-delay-ticks: 40

  # Buff display — render per-player active-buff state. Addons (e.g. Brewin' And Chewin') push their
  # buffs into this via the BuffBossbar API; FD renders them on the channels below.
  # Set enabled: false to suppress every buff display globally regardless of per-addon toggles.
  display:
    enabled: true
    # Display channels. List any combination — add/remove to route around another plugin that already
    # occupies a channel, so FD's buffs don't crowd/overwrite it. Options:
    #   bossbar    = one boss bar per active buff (laid out via layout-mode below). Stacks with other bars.
    #   actionbar  = all active buffs joined on the action bar line (above the hotbar); auto-refreshed so
    #                it never fades. Last writer wins, so avoid it if another plugin owns the action bar.
    #   tab_footer = active buffs listed in the player-list (TAB) footer; only the footer is touched.
    channels:
      - bossbar
    # Separator placed between buffs on the action bar (actionbar channel only).
    actionbar-separator: "   "
    # stacked = every active buff gets its own bossbar simultaneously (vanilla style; up to ~4 simultaneous is fine).
    # rotating = exactly one bossbar visible at a time, cycles to the next active buff every rotation-interval-ticks.
    layout-mode: stacked
    # Ticks between switches in rotating mode. Lower bound 20 (1 second). Ignored in stacked mode.
    rotation-interval-ticks: 80
    # How often (ticks) the action bar buff line is re-sent so it doesn't fade (~3s vanilla fade). Only used
    # when the actionbar channel is enabled; raise if another plugin fights over the action bar.
    actionbar-refresh-ticks: 30
    # Per-buff visual. color ∈ {PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE};
    # overlay ∈ {PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20}. Case-insensitive,
    # hyphen/underscore tolerant. Addons (e.g. BrewinAndChewin) configure their own buff styles in
    # their own config.yml; this section only covers FD's two built-in buffs.
    styles:
      nourishment: {color: GREEN, overlay: PROGRESS}
      comfort:     {color: BLUE,  overlay: PROGRESS}

  # Comfort mechanics. Assign Comfort to a CraftEngine food with an on-consume
  # farmersdelight:comfort function in that item's CE configuration.
  comfort:
    # How many ticks between each comfort heal tick; set to 0 to disable comfort healing and keep only the status display.
    heal-interval-ticks: 80
    # How much health (in HP; 1.0 = half a heart) each comfort heal tick restores.
    heal-amount: 1.0

  # Built-in Nourishment food assignments and durations live in the CraftEngine item configuration.
  # Use farmersdelight:nourishment as an on-consume function to add it to another CE food.

# World data the mod ships alongside its items: the crop trades farmer villagers and the wandering trader
# offer. Composting chances and furnace burn times no longer live here; they are set per item in the
# CraftEngine configuration under settings: compost_probability and fuel_time. The values reproduce the
# mod's own data exactly, so an untouched section behaves like the mod. Each of the two enabled switches
# turns its own behaviour off without affecting the others.
# The trades lists are content: deleting an entry is how you disable that one entry, and a deleted entry
# is not written back on the next startup.
world-data:

  # Trades the mod contributes to vanilla merchant listing pools. The pools themselves cannot be joined, so
  # an offer is substituted for a drawn vanilla one at the probability the mod's listing would have been
  # picked. chance is that probability: it is the share the mod's listings hold in the pool, so a datapack
  # that changes the vanilla pools needs these retuned.
  trades:
    # Crop trades farmer villagers offer. profession is a villager profession ID path and level is the
    # villager level whose pool the listing joins. ingredient is what the player hands over, result what
    # they receive. max-uses is how many times the trade works before restock, villager-xp the merchant
    # experience it awards, price-multiplier the vanilla demand and reputation multiplier.
    villager:
      enabled: true
      trades:
        - profession: farmer
          level: 1
          ingredient: farmersdelight:onion
          ingredient-amount: 26
          result: minecraft:emerald
          result-amount: 1
          max-uses: 16
          villager-xp: 2
          price-multiplier: 0.05
          chance: 0.14285714285714285
        - profession: farmer
          level: 1
          ingredient: farmersdelight:tomato
          ingredient-amount: 26
          result: minecraft:emerald
          result-amount: 1
          max-uses: 16
          villager-xp: 2
          price-multiplier: 0.05
          chance: 0.14285714285714285
        - profession: farmer
          level: 2
          ingredient: farmersdelight:cabbage
          ingredient-amount: 16
          result: minecraft:emerald
          result-amount: 1
          max-uses: 16
          villager-xp: 5
          price-multiplier: 0.05
          chance: 0.2
        - profession: farmer
          level: 2
          ingredient: farmersdelight:rice
          ingredient-amount: 20
          result: minecraft:emerald
          result-amount: 1
          max-uses: 16
          villager-xp: 5
          price-multiplier: 0.05
          chance: 0.2

    # Seed trades the wandering trader offers. It has no profession or level, so those two keys are unused
    # here. Buying slots (item -> emerald) are never substituted, so these listings always pay out in the
    # listed ingredient (an emerald by default) and receive the listed result.
    wandering-trader:
      enabled: true
      # Substitution stops once the trader has already drawn this many listings; on older versions this
      # keeps the separate rare listing untouched.
      generic-trade-count: 5
      trades:
        - ingredient: minecraft:emerald
          ingredient-amount: 1
          result: farmersdelight:cabbage_seeds
          result-amount: 1
          max-uses: 1
          villager-xp: 12
          price-multiplier: 0.05
          chance: 0.014705882352941176
        - ingredient: minecraft:emerald
          ingredient-amount: 1
          result: farmersdelight:tomato_seeds
          result-amount: 1
          max-uses: 1
          villager-xp: 12
          price-multiplier: 0.05
          chance: 0.014705882352941176
        - ingredient: minecraft:emerald
          ingredient-amount: 1
          result: farmersdelight:rice
          result-amount: 1
          max-uses: 1
          villager-xp: 12
          price-multiplier: 0.05
          chance: 0.014705882352941176
        - ingredient: minecraft:emerald
          ingredient-amount: 1
          result: farmersdelight:onion
          result-amount: 1
          max-uses: 1
          villager-xp: 12
          price-multiplier: 0.05
          chance: 0.014705882352941176
