    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  donkey:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
    looting-multiplier: 0.0
  horse:
    normal: minecraft:leather
    burning: ""
    chance: 1.0
