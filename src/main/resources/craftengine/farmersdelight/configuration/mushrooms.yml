  farmersdelight:wild_brown_mushroom_colony:
    biome:
      - minecraft:mushroom_fields
    environment:
      - minecraft:overworld
    feature:
      $$>=26.3:
        type: 'minecraft:simple_block'
        to_place:
          type: 'minecraft:simple'
          state:
            id: 'farmersdelight:brown_mushroom_colony'
            properties:
              age: '3'
      $$26.1~26.2:
        type: 'minecraft:simple_block'
        config:
          to_place:
            type: 'minecraft:simple_state_provider'
            state:
              Name: 'farmersdelight:brown_mushroom_colony'
