items:
  farmersdelight:brown_mushroom_colony:
    data:
      item-name: <!i><lang:block.farmersdelight.brown_mushroom_colony>
    model: farmersdelight:item/brown_mushroom_colony
    behaviors:
      - type: compostable_item
        chance: 1.0
      - type: block_item
        block: farmersdelight:brown_mushroom_colony
    settings:
      compost_probability: 1.0
  farmersdelight:red_mushroom_colony:
    data:
      item-name: <!i><lang:block.farmersdelight.red_mushroom_colony>
    model: farmersdelight:item/red_mushroom_colony
    behaviors:
      - type: compostable_item
        chance: 1.0
      - type: block_item
        block: farmersdelight:red_mushroom_colony
    settings:
      compost_probability: 1.0
  minecraft:brown_mushroom:
    behavior:
      type: farmersdelight:conditional_block_planting
      rules:
        - target: farmersdelight:rich_soil
          block: farmersdelight:brown_mushroom
        - target: farmersdelight:organic_compost
          block: farmersdelight:brown_mushroom
  minecraft:red_mushroom:
    behavior:
      type: farmersdelight:conditional_block_planting
      rules:
        - target: farmersdelight:rich_soil
          block: farmersdelight:red_mushroom
        - target: farmersdelight:organic_compost
          block: farmersdelight:red_mushroom
blocks:
  farmersdelight:brown_mushroom:
    settings:
      template:
        - default:hardness/none
      overrides:
        item: minecraft:brown_mushroom
        push-reaction: destroy
    behaviors:
      - type: bush_block
        bottom-block-tags:
          - minecraft:mushroom_grow_block
        bottom-blocks:
          - farmersdelight:rich_soil
          - farmersdelight:organic_compost
    state:
      state: brown_mushroom
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: survives_explosion
          entries:
            - type: item
              item: minecraft:brown_mushroom
  farmersdelight:red_mushroom:
    settings:
      template:
        - default:hardness/none
      overrides:
        item: minecraft:red_mushroom
        push-reaction: destroy
    behaviors:
      - type: bush_block
        bottom-block-tags:
          - minecraft:mushroom_grow_block
        bottom-blocks:
          - farmersdelight:rich_soil
          - farmersdelight:organic_compost
    state:
      state: red_mushroom
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: survives_explosion
          entries:
            - type: item
              item: minecraft:red_mushroom
  farmersdelight:brown_mushroom_colony:
    settings:
      template:
        - default:hardness/none
      overrides:
        item: farmersdelight:brown_mushroom_colony
        push-reaction: destroy
        is-randomly-ticking: true
    behaviors:
      - type: farmersdelight:mushroom_colony
        mushroom-type: "minecraft:brown_mushroom"
        light:
          requirement: 0
        grow-on:
          blocks:
            - farmersdelight:rich_soil
            - farmersdelight:organic_compost
        place-on:
          block-tags:
            - minecraft:mushroom_grow_block
          overrides-default: false
    states:
      properties:
        age:
          type: int
          default: 3
          range: 0~3
      appearances:
        age=0:
          auto_state: lower_tripwire
          model: farmersdelight:block/brown_mushroom_colony_stage0
        age=1:
          auto_state: lower_tripwire
          model: farmersdelight:block/brown_mushroom_colony_stage1
        age=2:
          auto_state: higher_tripwire
          model: farmersdelight:block/brown_mushroom_colony_stage2
        age=3:
          auto_state: sugar_cane
          model: farmersdelight:block/brown_mushroom_colony_stage3
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
    events:
      - on: break
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: alternatives
                      children:
                        - type: item
                          item: farmersdelight:brown_mushroom_colony
                          count: 1
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 3
                            - type: match_item
                              item: minecraft:shears
                        - type: item
                          item: minecraft:brown_mushroom
                          count: 5
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 3
                        - type: item
                          item: minecraft:brown_mushroom
                          count: 4
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 2
                        - type: item
                          item: minecraft:brown_mushroom
                          count: 3
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 1
                        - type: item
                          item: minecraft:brown_mushroom
                          count: 2
  farmersdelight:red_mushroom_colony:
    settings:
      template:
        - default:hardness/none
      overrides:
        item: farmersdelight:red_mushroom_colony
        push-reaction: destroy
        is-randomly-ticking: true
    behaviors:
      - type: farmersdelight:mushroom_colony
        mushroom-type: "minecraft:red_mushroom"
        light:
          requirement: 0
        grow-on:
          blocks:
            - farmersdelight:rich_soil
            - farmersdelight:organic_compost
        place-on:
          block-tags:
            - minecraft:mushroom_grow_block
          overrides-default: false
    states:
      properties:
        age:
          type: int
          default: 3
          range: 0~3
      appearances:
        age=0:
          auto_state: lower_tripwire
          model: farmersdelight:block/red_mushroom_colony_stage0
        age=1:
          auto_state: lower_tripwire
          model: farmersdelight:block/red_mushroom_colony_stage1
        age=2:
          auto_state: higher_tripwire
          model: farmersdelight:block/red_mushroom_colony_stage2
        age=3:
          auto_state: sugar_cane
          model: farmersdelight:block/red_mushroom_colony_stage3
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
    events:
      - on: break
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: alternatives
                      children:
                        - type: item
                          item: farmersdelight:red_mushroom_colony
                          count: 1
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 3
                            - type: match_item
                              item: minecraft:shears
                        - type: item
                          item: minecraft:red_mushroom
                          count: 5
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 3
                        - type: item
                          item: minecraft:red_mushroom
                          count: 4
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 2
                        - type: item
                          item: minecraft:red_mushroom
                          count: 3
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 1
                        - type: item
                          item: minecraft:red_mushroom
                          count: 2
