                  count:
                    type: uniform
                    min: 2
                    max: 4
            - type: item
              item: farmersdelight:cabbage_seeds
              weight: 1
              functions:
                - type: set_count
                  add: false
                  count:
                    type: uniform
                    min: 2
                    max: 4
            - type: empty
              functions: []
              weight: 2
        - rolls: 3
