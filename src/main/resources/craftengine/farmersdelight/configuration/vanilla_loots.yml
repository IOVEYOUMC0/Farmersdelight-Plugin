vanilla_loots:
  farmersdelight:onion_from_zombie:
    type: entity
    target: minecraft:zombie
    loot:
      pools:
        - rolls: 1
          conditions:
            - type: has_player
            - type: table_bonus
              enchantment: minecraft:looting
              chances:
                - 0.02
                - 0.03
                - 0.04
                - 0.05
          entries:
            - type: item
              item: farmersdelight:onion

