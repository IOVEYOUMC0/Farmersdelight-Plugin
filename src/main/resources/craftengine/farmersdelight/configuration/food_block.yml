templates:
  farmersdelight:sliceable_pie_states:
    states:
      properties:
        bites:
          type: int
          default: 0
          range: 0~3
        facing:
          type: 4-direction
          default: north
      appearances:
        count_0_east:
          auto_state:
            type: solid
            id: ${__ID__}
          transparent: true
          entity-renderer:
            type: item_display
            item: ${__NAMESPACE__}:${__ID__}_slice0
            scale: 1.0
            translation: 0,0,0
            yaw: 90
        count_0_north:
