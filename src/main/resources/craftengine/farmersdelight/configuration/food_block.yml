  farmersdelight:pie_events:
    events:
      - on: break
        conditions:
          - type: test_flag
            flag: interact
          - type: match_block_property
            properties:
              bites: 0
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: ${drop_item}
                      count: 1
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: match_item
            item: "farmersdelight:.*_knife"
            regex: true
          - type: match_block_property
            properties:
              bites: 0
        functions:
          - type: update_interaction_tick
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.3
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: ${__NAMESPACE__}:${__ID__}_slice
                      count: 1
          - type: update_block_property
            properties:
              bites: 1
          - type: swing_hand
          - type: play_sound
            sound: farmersdelight:block.food.slice
          - type: cancel_event
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: match_item
            item: "farmersdelight:.*_knife"
            regex: true
          - type: match_block_property
            properties:
              bites: 1
        functions:
          - type: update_interaction_tick
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.3
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: ${__NAMESPACE__}:${__ID__}_slice
                      count: 1
          - type: update_block_property
            properties:
              bites: 2
          - type: swing_hand
          - type: play_sound
            sound: farmersdelight:block.food.slice
          - type: cancel_event
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: match_item
            item: "farmersdelight:.*_knife"
            regex: true
          - type: match_block_property
            properties:
              bites: 2
        functions:
          - type: update_interaction_tick
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.3
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: ${__NAMESPACE__}:${__ID__}_slice
                      count: 1
          - type: update_block_property
            properties:
              bites: 3
          - type: swing_hand
          - type: play_sound
            sound: farmersdelight:block.food.slice
          - type: cancel_event
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: match_item
            item: "farmersdelight:.*_knife"
            regex: true
          - type: match_block_property
            properties:
              bites: 3
        functions:
          - type: update_interaction_tick
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.3
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: ${__NAMESPACE__}:${__ID__}_slice
                      count: 1
          - type: break_block
            x: <arg:position.block_x>
            y: <arg:position.block_y>
            z: <arg:position.block_z>
          - type: swing_hand
          - type: play_sound
            sound: farmersdelight:block.food.slice
          - type: cancel_event
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: expression  
            expression: "<arg:player.food> < 20"
          - type: inverted
            term:
              type: match_item
              item: "farmersdelight:.*_knife"
              regex: true
          - type: match_block_property
            properties:
              bites: 0
        functions:
          - type: update_interaction_tick
          - type: set_food
            target: self
            food: 6
            add: true
          - type: set_saturation
            target: self
            saturation: 3
            add: true
          - type: update_block_property
            properties:
              bites: 1
          - type: swing_hand
          - type: play_sound
            sound: minecraft:entity.generic.eat
          - type: potion_effect
            target: self
            potion-effect: minecraft:speed
            duration: 600
            amplifier: 0
            particles: false
      - on: right_click
        conditions:
          - type: test_flag
            flag: interact
          - type: expression
            expression: "<arg:player.food> < 20"
          - type: inverted
            term:
              type: match_item
              item: "farmersdelight:.*_knife"
              regex: true
          - type: match_block_property
            properties:
              bites: 1
        functions:
          - type: update_interaction_tick
          - type: set_food
            target: self
            food: 6
            add: true
          - type: set_saturation
            target: self
            saturation: 3
            add: true
          - type: update_block_property
            properties:
              bites: 2
          - type: swing_hand
