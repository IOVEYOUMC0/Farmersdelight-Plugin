templates:
  farmersdelight:block_item_template:
    model: ${__NAMESPACE__}:block/${__ID__}
    behavior:
      type: block_item
      block: ${__NAMESPACE__}:${__ID__}
  farmersdelight:block_loot_template:
    loot:
      template: default:loot_table/self
  farmersdelight:block_template:
    states:
      properties:
        facing:
          type: 4-direction
          default: north
      appearances:
        east:
          auto-state: mushroom
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 90
        north:
          auto-state: mushroom
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
        south:
          auto-state: mushroom
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 180
        west:
          auto-state: mushroom
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 270
      variants:
        facing=east:
          appearance: east
        facing=north:
          appearance: north
        facing=south:
          appearance: south
        facing=west:
          appearance: west
  farmersdelight:block_crate_template:
    settings:
      hardness: 2
      resistance: 1
      burnable: true
      burn-chance: 75
      fire-spread-chance: 50
      tags:
        - minecraft:mineable/axe
      sounds:
        break: minecraft:block.wood.break
        fall: minecraft:block.wood.fall
        hit: minecraft:block.wood.hit
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
    states:
      auto-state: mushroom_stem
      model:
        path: ${__NAMESPACE__}:block/${__ID__}
  farmersdelight:block_cabinet_template:
    settings:
      hardness: 1.5
      resistance: 0.5
      push-reaction: block
      burnable: true
      burn-chance: 50
      fire-spread-chance: 50
      propagate-skylight: true
      is-randomly-ticking: false
      tags:
        - minecraft:mineable/axe
      sounds:
        break: minecraft:block.wood.break
        fall: minecraft:block.wood.fall
        hit: minecraft:block.wood.hit
        place: minecraft:block.wood.place
        step: minecraft:block.wood.step
    behavior:
      type: simple_storage_block
      title: "<!i>橱柜"
      rows: 3
      allow-input: true
      allow-output: true
      sounds:
        open: minecraft:block.barrel.open
        close: minecraft:block.barrel.close
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        open:
          type: boolean
          default: false
      appearances:
        east:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 90
        east_open:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_open
            y: 90
        north:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
        north_open:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_open
        south:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 180
        south_open:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_open
            y: 180
        west:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 270
        west_open:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_open
            y: 270
      variants:
        facing=east,open=false:
          appearance: east
        facing=east,open=true:
          appearance: east_open
        facing=north,open=false:
          appearance: north
        facing=north,open=true:
          appearance: north_open
        facing=south,open=false:
          appearance: south
        facing=south,open=true:
          appearance: south_open
        facing=west,open=false:
          appearance: west
        facing=west,open=true:
          appearance: west_open
items:
  farmersdelight:stove:
    template: farmersdelight:block_item_template
    data:
      item-name: <!i><l10n:block.farmersdelight.stove>
    behavior:
      type: block_item
      block: farmersdelight:stove
  farmersdelight:cooking_pot:
    data:
      item-name: <!i><l10n:block.farmersdelight.cooking_pot>
    model: farmersdelight:block/cooking_pot
    behavior:
      type: ground_block_item
      block: farmersdelight:cooking_pot
    nbt:
      HideDurability: true
  farmersdelight:skillet:
    material: iron_sword
    data:
      item-name: <!i><l10n:block.farmersdelight.skillet>
      hide-tooltip:
        - attribute_modifiers
      attribute-modifiers:
        - type: minecraft:attack_damage
          slot: mainhand
          amount: 8
          operation: add_value
        - type: minecraft:attack_speed
          slot: mainhand
          amount: -0.7
          operation: add_multiplied_base
        - type: minecraft:attack_knockback
          slot: mainhand
          amount: 1
          operation: add_value
      lore:
        - content:
          - ''
          - '<!i><gray><lang:item.modifiers.mainhand></gray>'
          - '<!i><dark_green>  8 <lang:attribute.name.attack_damage></dark_green>'
          - '<!i><dark_green>  0.9 <lang:attribute.name.attack_speed></dark_green>'
          - '<!i><blue>  +1 <lang:attribute.name.attack_knockback></blue>'
    model: farmersdelight:item/skillet
  farmersdelight:cutting_board:
    data:
      item-name: <!i><l10n:block.farmersdelight.cutting_board>
    model: farmersdelight:block/cutting_board
    behavior:
