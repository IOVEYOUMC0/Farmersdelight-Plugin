furniture:
  farmersdelight:tray:
    settings:
      item: farmersdelight:tray
      sounds:
        break: minecraft:block.lantern.break
        place: minecraft:block.lantern.place
    loot:
      template: default:loot_table/self
    variants:
      ground:
        elements:
        - item: farmersdelight:tray
          position: 0,0.5,0
          translation: 0,0,0
          scale: 0.999
        hitboxes:
        - position: 0,0,0
          type: interaction
          width: 0.5
          height: 1
          blocks-building: false
          can-use-item-on: false
          interactive: false
          invisible: true
block:
  farmersdelight:stove:
    settings:
      hardness: 2
      resistance: 6
      push-reaction: block
      require-correct-tools: true
      correct-tools:
      - minecraft:wooden_pickaxe
      - minecraft:stone_pickaxe
      - minecraft:iron_pickaxe
      - minecraft:golden_pickaxe
      - minecraft:diamond_pickaxe
      - minecraft:netherite_pickaxe
      tags:
      - minecraft:mineable/pickaxe
      sounds:
        break: minecraft:block.stone.break
        fall: minecraft:block.stone.fall
        hit: minecraft:block.stone.hit
        place: minecraft:block.stone.place
        step: minecraft:block.stone.step
    behavior:
    - type: farmersdelight:stove
      crackle-sound: farmersdelight:block.stove.crackle
      burn:
        enabled: true
        damage: 1.0
    loot:
      template: default:loot_table/self
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        fire:
          type: boolean
          default: true
      appearances:
        east:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 90
        east_on:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
            y: 90
        north:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
        north_on:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
        south:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 180
        south_on:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
            y: 180
        west:
          auto_state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 270
        west_on:
          auto_state: note_block
