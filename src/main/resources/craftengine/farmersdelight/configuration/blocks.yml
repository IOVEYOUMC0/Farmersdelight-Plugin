block:
  farmersdelight:stove:
    settings:
      hardness: 1
      resistance: 2
      push-reaction: block
      require-correct-tools: true
      correct-tools:
        - minecraft:wooden_pickaxe
        - minecraft:stone_pickaxe
        - minecraft:iron_pickaxe
        - minecraft:golden_pickaxe
        - minecraft:diamond_pickaxe
        - minecraft:netherite_pickaxe
      tags:
        - minecraft:mineable/pickaxe
      sounds:
        break: minecraft:block.stone.break
        fall: minecraft:block.stone.fall
        hit: minecraft:block.stone.hit
        place: minecraft:block.stone.place
        step: minecraft:block.stone.step
    behavior:
      - type: farmersdelight:stove
        crackle-sound: farmersdelight:block.stove.crackle
    loot:
      template: default:loot_table/self
    states:
      properties:
        facing:
          type: 4-direction
          default: north
        fire:
          type: boolean
          default: true
      appearances:
        east:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 90
        east_on:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
            y: 90
        north:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
        north_on:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
        south:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 180
        south_on:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
            y: 180
        west:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}
            y: 270
        west_on:
          auto-state: note_block
          model:
            path: ${__NAMESPACE__}:block/${__ID__}_on
            y: 270
          settings:
            luminance: 15 
      variants:
        facing=east,fire=false:
          appearance: east
        facing=east,fire=true:
          appearance: east_on
          settings:
            luminance: 15
        facing=north,fire=false:
          appearance: north
        facing=north,fire=true:
          appearance: north_on
          settings:
            luminance: 15
        facing=south,fire=false:
          appearance: south
        facing=south,fire=true:
          appearance: south_on
          settings:
            luminance: 15
        facing=west,fire=false:
          appearance: west
        facing=west,fire=true:
          appearance: west_on
          settings:
            luminance: 15
    events:
      - on: right_click
        conditions:
          - type: match_block_property
            properties:
              fire: true
          - type: match_item
            id: minecraft:potion
        functions:
          - type: update_interaction_tick
          - type: update_block_property
            properties:
              fire: false
          - type: play_sound
            sound: minecraft:block.fire.extinguish
          - type: set_count
            target: self
            count: -1
            add: true
          - type: swing_hand
          - type: drop_loot
            x: <arg:block.block_x>
            y: <arg:block.block_y> + 2
            z: <arg:block.block_z>
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: minecraft:glass_bottle
                      count: 1
      - on: right_click
        conditions:
          - type: match_block_property
            properties:
              fire: true
          - type: match_item
            id: minecraft:water_bucket
        functions:
          - type: update_interaction_tick
          - type: update_block_property
            properties:
              fire: false
          - type: play_sound
            sound: minecraft:block.fire.extinguish
          - type: set_count
            target: self
            count: -1
            add: true
          - type: swing_hand
          - type: drop_loot
            x: <arg:block.block_x>
            y: <arg:block.block_y> + 2
            z: <arg:block.block_z>
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: minecraft:bucket
                      count: 1
      - on: right_click
        conditions:
          - type: match_block_property
            properties:
              fire: false
          - type: match_item
            id: minecraft:flint_and_steel
        functions:
          - type: cancel_event
          - type: update_interaction_tick
          - type: update_block_property
            properties:
              fire: true
          - type: play_sound
            sound: minecraft:item.flintandsteel.use
          - type: damage_item
            damage: 1
          - type: swing_hand
      - on: right_click
        conditions:
          - type: match_block_property
            properties:
              fire: false
          - type: match_item
            id: minecraft:fire_charge
        functions:
          - type: cancel_event
          - type: update_interaction_tick
          - type: update_block_property
            properties:
              fire: true
          - type: play_sound
            sound: minecraft:item.firecharge.use
          - type: set_count
            target: self
            count: -1
            add: true
          - type: swing_hand
