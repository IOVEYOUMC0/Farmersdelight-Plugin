      item-name: <!i><lang:block.farmersdelight.stove>
    behavior:
      type: block_item
      block: farmersdelight:stove
  farmersdelight:cooking_pot:
    data:
      item-name: <!i><lang:block.farmersdelight.cooking_pot>
    model: farmersdelight:block/cooking_pot
    behavior:
      type: ground_block_item
      block: farmersdelight:cooking_pot
  farmersdelight:cooking_pot_handle:
    data:
      item-name: <!i><lang:block.farmersdelight.cooking_pot>
    model: farmersdelight:block/cooking_pot_bail
  farmersdelight:skillet:
    material: nether_brick
    behavior:
      type: farmersdelight:skillet_item
      permission: farmersdelight.use.skillet
      cooking-model: farmersdelight:skillet_cooking
      ingredient-overlay-model: farmersdelight:item/skillet_food
    data:
      components:
        minecraft:max_stack_size: 1
      item-name: <!i><lang:block.farmersdelight.skillet>
      hide-tooltip:
      - attribute_modifiers
      attribute-modifiers:
      - type: minecraft:attack_damage
        slot: mainhand
        amount: 7
        operation: add_value
      - type: minecraft:attack_speed
        slot: mainhand
        amount: -3.1
        operation: add_value
      - type: minecraft:attack_knockback
        slot: mainhand
        amount: 1
        operation: add_value
      lore:
      - content:
        - <!i><dark_gray><lang:farmersdelight.tooltip.placeable_sneaking></dark_gray>
        - ''
        - <!i><gray><lang:item.modifiers.mainhand></gray>
        - <!i><dark_green>  8 <lang:attribute.name.attack_damage></dark_green>
        - <!i><dark_green>  0.9 <lang:attribute.name.attack_speed></dark_green>
        - <!i><blue>  +1 <lang:attribute.name.attack_knockback></blue>
    settings:
      farmersdelight:sword:
        max-durability: 250
        enchantability: 14
        attack-sound: farmersdelight:item.skillet.attack.strong
        attack-sound-weak: farmersdelight:item.skillet.attack.weak
    model: farmersdelight:item/skillet
  farmersdelight:cutting_board:
