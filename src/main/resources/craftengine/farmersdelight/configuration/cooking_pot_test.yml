# ============================================================================
# Test: custom cooking pot variant `farmersdelight:large_pot`
# ============================================================================
#
# This file is shipped with everything commented out so it has no effect by
# default. Uncomment the two sections below + the two matching commented
# entries in gui.yml (`cooking-pot-guis.large_pot` and
# `recipe-detail-cooking-pot-guis.large_pot`) to register a fully self-
# contained custom cooking pot.
#
# Purpose: exercise the per-variant pack/unpack path end to end —
#   * `data-key: farmersdelight:large_pot` isolates the packed NBT key, so
#     a packed large_pot doesn't clash with the default cooking_pot's data.
#   * `custom.id: large_pot` links the block behavior to gui.yml's per-id
#     GUI map (both `cooking-pot-guis` and `recipe-detail-cooking-pot-guis`).
#   * `custom.input-slots: 6` doubles the default 3 ingredient slots,
#     exercising the layout-override path.
#
# To test (after uncommenting all 4 sections):
#   1. /ce reload   or   restart the server.
#   2. /ce give @s farmersdelight:large_pot   (creative-place the test pot).
#   3. Drop some ingredients in, close, break the pot. The packed item should
#      drop with the meal lore + bar + hidden Durability line (just like the
#      default pot). Re-place it: contents restored.

