items:
  minecraft:wheat_seeds:
    behavior:
      type: farmersdelight:conditional_block_planting
      rules:
        - target: farmersdelight:rich_soil_farmland
          block: farmersdelight:wheat
  minecraft:beetroot_seeds:
    behavior:
      type: farmersdelight:conditional_block_planting
      rules:
