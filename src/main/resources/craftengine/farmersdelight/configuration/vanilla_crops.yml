blocks:
  farmersdelight:wheat:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      overrides:
        item: minecraft:wheat_seeds
        push-reaction: destroy
        is-randomly-ticking: true
      tags:
        - minecraft:bee_growables
        - minecraft:crops
        - minecraft:maintains_farmland
    behaviors:
      - type: liquid_flowable_block
      - type: crop_block
        grow-speed: 1.0
        light-requirement: 9
        is-bone-meal-target: true
        bone_meal_age_bonus:
          type: uniform
          min: 1
          max: 3
      - type: bush_block
        bottom-blocks:
          - minecraft:farmland
          - farmersdelight:rich_soil_farmland
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~7
      appearances:
        age=0:
          state: wheat[age=0]
        age=1:
          state: wheat[age=1]
        age=2:
          state: wheat[age=2]
        age=3:
          state: wheat[age=3]
        age=4:
          state: wheat[age=4]
        age=5:
          state: wheat[age=5]
        age=6:
          state: wheat[age=6]
        age=7:
          state: wheat[age=7]
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
        age=4:
          appearance: age=4
        age=5:
          appearance: age=5
        age=6:
          appearance: age=6
        age=7:
          appearance: age=7
    loot:
      template: default:loot_table/seed_crop
      arguments:
        crop_item: minecraft:wheat
        crop_seed: minecraft:wheat_seeds
        ripe_age: 7

