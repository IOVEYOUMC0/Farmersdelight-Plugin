                  entries:
                    - type: item
                      item: farmersdelight:tomato
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 3
                - rolls: 1
                  entries:
                    - type: item
                      item: farmersdelight:rotten_tomato
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 2
                      conditions:
                        - type: random
                          chance: 0.0001
          - type: update_block_property
            properties:
              age: 4
          - type: swing_hand
      - on: break
