            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: farmersdelight:tomato
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 2
                - rolls: 1
                  entries:
                    - type: item
                      item: farmersdelight:rotten_tomato
                      conditions:
                        - type: random
                          value: 0.05
          - type: update_block_property
            properties:
              age: 0
          - type: swing_hand
          - type: play_sound
            sound: farmersdelight:block.tomato_bush.pick_tomatoes
      - on: break
        conditions:
          - type: match_block_property
            properties:
              age: 3
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              functions:
                - type: explosion_decay
              pools:
                - rolls: 1
                  entries:
                    - type: item
                      item: farmersdelight:tomato
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 2
                        - type: apply_bonus
                          enchantment: minecraft:fortune
                          formula:
                            type: binomial_with_bonus_count
                            extra: 0
                            probability: 0.5
                - rolls: 1
                  conditions:
                    - type: random
                      value: 0.05
                  entries:
                    - type: item
                      item: farmersdelight:rotten_tomato
                      count: 1
