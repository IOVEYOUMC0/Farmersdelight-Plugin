          model: farmersdelight:block/cabbages_stage6
        age=7:
          auto-state: higher_tripwire
          model: farmersdelight:block/cabbages_stage7
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
        age=4:
          appearance: age=4
        age=5:
          appearance: age=5
        age=6:
          appearance: age=6
        age=7:
          appearance: age=7
    events:
      - on: break
        functions:
          - type: drop_loot
            x: <arg:block.block_x> + 0.5
            y: <arg:block.block_y> + 0.5
            z: <arg:block.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: alternatives
                      children:
                        - type: item
                          item: farmersdelight:cabbage
                          functions:
                            - type: set_count
                              count:
                                type: uniform
                                min: 1
                                max: 3
                          conditions:
                            - type: match_block_property
                              properties:
                                age: 7
                        - type: item
                          item: farmersdelight:cabbage_seeds
                          count: 1
                          conditions:
                            - type: inverted
                              term:
                                type: match_block_property
                                properties:
                                  age: 7
                - rolls: 1
                  conditions:
                    - type: match_block_property
                      properties:
                        age: 7
                  entries:
                    - type: item
                      item: farmersdelight:cabbage_seeds
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 3
                        - type: apply_bonus
                          enchantment: minecraft:fortune
                          formula:
                            type: binomial_with_bonus_count
                            extra: 5
                            probability: 0.5714286
  farmersdelight:tomatoes:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      overrides:
        item: farmersdelight:tomato_seeds
        push-reaction: destroy
        is-randomly-ticking: true
      tags:
