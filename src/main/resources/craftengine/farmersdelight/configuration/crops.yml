        push-reaction: destroy
        is-randomly-ticking: true
      tags:
        - minecraft:crops
        - minecraft:maintains_farmland
    behaviors:
      - type: liquid_flowable_block
      - type: crop_block
        grow-speed: 0.25
        light-requirement: 9
        is-bone-meal-target: true
        bone_meal_age_bonus:
