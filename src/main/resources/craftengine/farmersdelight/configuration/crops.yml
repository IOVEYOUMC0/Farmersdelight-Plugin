blocks:
  farmersdelight:onions:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      overrides:
        item: farmersdelight:onion
        push-reaction: destroy
        is-randomly-ticking: true
      tags:
        - minecraft:bee_growables
        - minecraft:crops
        - minecraft:maintains_farmland
    behaviors:
      - type: liquid_flowable_block
      - type: crop_block
        grow-speed: 0.25
        light-requirement: 9
        is-bone-meal-target: true
        bone_meal_age_bonus:
          type: uniform
          min: 1
          max: 3
      - type: bush_block
        bottom-blocks:
          - minecraft:farmland
          - farmersdelight:rich_soil_farmland
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~3
      appearances:
        age=0:
          auto_state: lower_tripwire
          model: farmersdelight:block/onions_stage0
        age=1:
          auto_state: higher_tripwire
          model: farmersdelight:block/onions_stage1
        age=2:
          auto_state: higher_tripwire
          model: farmersdelight:block/onions_stage2
        age=3:
          auto_state: sugar_cane
          model: farmersdelight:block/onions_stage3
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
    loot:
      functions:
        - type: explosion_decay
      pools:
        - rolls: 1
          entries:
            - type: item
              item: farmersdelight:onion
              count: 1
        - rolls: 1
          conditions:
            - type: match_block_property
              properties:
                age: 3
          entries:
            - type: item
              item: farmersdelight:onion
              count: 1
              functions:
                - type: apply_bonus
                  enchantment: minecraft:fortune
                  formula:
                    type: binomial_with_bonus_count
                    extra: 3
                    probability: 0.5714286
  farmersdelight:rice:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      overrides:
        item: farmersdelight:rice
        push-reaction: destroy
        is-randomly-ticking: true
      tags:
        - minecraft:bee_growables
        - minecraft:crops
        - minecraft:maintains_farmland
    behaviors:
      - type: farmersdelight:tall_crop
        extra_planting_items:
          - farmersdelight:rice_panicle
        grow-speed: 0.25
        light:
          requirement: 6
        bone-meal:
          is-target: true
          age-bonus:
            type: uniform
            min: 1
            max: 4
        requires-water: true
        harvest-tool:
          tags:
            - "#farmersdelight:tools/knives"
        bottom-block-tags:
          - "#minecraft:dirt"
        bottom-blocks:
          - minecraft:grass_block
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~4
        half:
          type: double_block_half
          default: lower
      appearances:
        age=0,half=lower:
          auto_state: kelp
          model: farmersdelight:block/rice_stage0
        age=1,half=lower:
          auto_state: kelp
          model: farmersdelight:block/rice_stage1
        age=2,half=lower:
          auto_state: kelp
          model: farmersdelight:block/rice_stage2
        age=3,half=lower:
          auto_state: kelp
          model: farmersdelight:block/rice_stage3
        age=4,half=lower:
          auto_state: kelp
          model: farmersdelight:block/rice_supporting
        age=0,half=upper:
          auto_state: lower_tripwire
          model: farmersdelight:block/rice_panicles_stage0
        age=1,half=upper:
          auto_state: lower_tripwire
          model: farmersdelight:block/rice_panicles_stage1
        age=2,half=upper:
          auto_state: higher_tripwire
          model: farmersdelight:block/rice_panicles_stage2
        age=3,half=upper:
          auto_state: higher_tripwire
          model: farmersdelight:block/rice_panicles_stage3
      variants:
        age=0,half=lower:
          appearance: age=0,half=lower
          settings:
            fluid_state: water
        age=1,half=lower:
          appearance: age=1,half=lower
          settings:
            fluid_state: water
        age=2,half=lower:
          appearance: age=2,half=lower
          settings:
            fluid_state: water
        age=3,half=lower:
          appearance: age=3,half=lower
          settings:
            fluid_state: water
        age=4,half=lower:
          appearance: age=4,half=lower
          settings:
            fluid_state: water
        age=0,half=upper:
          appearance: age=0,half=upper
        age=1,half=upper:
          appearance: age=1,half=upper
        age=2,half=upper:
          appearance: age=2,half=upper
        age=3,half=upper:
          appearance: age=3,half=upper
    events:
      - on: break
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  conditions:
                    - type: match_block_property
                      properties:
                        half: lower
                    - type: survives_explosion
                  entries:
                    - type: item
                      item: farmersdelight:rice
                      count: 1
                - rolls: 1
                  conditions:
                    - type: match_block_property
                      properties:
                        half: upper
                        age: 3
                  functions:
                    - type: explosion_decay
                  entries:
                    - type: alternatives
                      children:
                        - type: item
                          item: farmersdelight:rice
                          conditions:
                            - type: farmersdelight:is_knife
                        - type: item
                          item: farmersdelight:rice_panicle
                - rolls: 1
                  conditions:
                    - type: match_block_property
                      properties:
                        half: upper
                        age: 3
                    - type: farmersdelight:is_knife
                  entries:
                    - type: item
                      item: farmersdelight:straw
                      functions:
                        - type: set_count
                          count:
                            type: uniform
                            min: 1
                            max: 1
  farmersdelight:cabbages:
