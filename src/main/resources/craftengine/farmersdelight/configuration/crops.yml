        is-bone-meal-target: true
        bone_meal_age_bonus:
          type: uniform
          min: 1
          max: 2
      - type: bush_block
        bottom-blocks:
          - farmersdelight:tomatoes
        stackable: true
        max-height: 3
        delay: 1
      - type: farmersdelight:tomato_vine
        blocks:
          budding: farmersdelight:budding_tomatoes
          tomatoes: farmersdelight:tomatoes
          crop-on-rope: farmersdelight:tomato_crop_on_rope
        mature-age: 0
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~3
      appearances:
        age=0:
          auto_state: twisting_vines
          model: farmersdelight:block/tomatoes_vine_stage0
        age=1:
          auto_state: twisting_vines
          model: farmersdelight:block/tomatoes_vine_stage1
        age=2:
          auto_state: twisting_vines
          model: farmersdelight:block/tomatoes_vine_stage2
        age=3:
          auto_state: twisting_vines
          model: farmersdelight:block/tomatoes_vine_stage3
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
    events:
