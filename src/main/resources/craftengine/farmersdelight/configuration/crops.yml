                  count: 1
                  conditions:
                    - type: match_block_property
                      properties:
                        age: 7
                - type: item
                  item: farmersdelight:cabbage_seeds
                  count: 1
                  conditions:
                    - type: inverted
                      term:
                        type: match_block_property
                        properties:
                          age: 7
        - rolls: 1
          conditions:
            - type: match_block_property
              properties:
                age: 7
          entries:
            - type: item
              item: farmersdelight:cabbage_seeds
              count: 1
              functions:
                - type: apply_bonus
                  enchantment: minecraft:fortune
                  formula:
                    type: binomial_with_bonus_count
                    extra: 3
