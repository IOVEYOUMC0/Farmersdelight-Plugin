templates:
  farmersdelight:icons_big:
    model:
      type: minecraft:model
      path: farmersdelight:gui/icons/${__ID__}
      generation:
        parent: minecraft:item/generated
        textures:
          layer0: farmersdelight:gui/sprites/icons/${__ID__}
        display:
          gui:
            scale: [1.38, 1.38, 1.38]
  farmersdelight:icons:
    model:
      type: minecraft:model
      path: ${__NAMESPACE__}:gui/icons/${__ID__}
      generation:
        parent: minecraft:item/generated
        textures:
          layer0: ${__NAMESPACE__}:gui/sprites/icons/${__ID__}
items:
  farmersdelight:cooking_pot_heated:
    template: farmersdelight:icons
    data:
      item-name: <!i><red><lang:farmersdelight.gui.heated></red>
  farmersdelight:cooking_pot_not_heated:
    template: farmersdelight:icons
    data:
      item-name: <!i><gray><lang:farmersdelight.gui.not_heated></gray>
