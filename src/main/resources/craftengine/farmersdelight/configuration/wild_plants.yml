    loot:
      pools:
        - rolls: 1
          entries:
            - type: alternatives
              children:
                - type: item
                  item: farmersdelight:wild_tomatoes
                  conditions:
                    - type: match_item
                      item: minecraft:shears
                - type: item
                  item: farmersdelight:tomato_seeds
                  count: 1
                  functions:
                    - type: explosion_decay
                    - type: apply_bonus
                      enchantment: minecraft:fortune
                      formula:
                        type: binomial_with_bonus_count
                        extra: 0
                        probability: 1.0
        - rolls: 1
