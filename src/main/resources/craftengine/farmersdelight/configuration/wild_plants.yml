  farmersdelight:wild_rice:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      tags:
        - minecraft:flowers
        - minecraft:tall_flowers
        - farmersdelight:wild_crops
        - farmersdelight:unaffected_by_rich_soil
    overrides:
      item: farmersdelight:wild_rice
      push-reaction: destroy
    behaviors:
      - type: double_high_block
      - type: farmersdelight:wild_rice
        requires-water: true
        bottom-block-tags:
          - "#minecraft:dirt"
        bottom-blocks:
          - minecraft:grass_block
          - minecraft:mud
          - minecraft:sand
          - minecraft:red_sand
    states:
      properties:
        half:
          type: double_block_half
          default: lower
      appearances:
        half=lower:
          auto_state: kelp
          model: farmersdelight:block/wild_rice_bottom
        half=upper:
          auto_state: higher_tripwire
          model: farmersdelight:block/wild_rice_top
      variants:
        half=lower:
          appearance: half=lower
          settings:
            fluid_state: water
        half=upper:
          appearance: half=upper
    events:
      - on: break
        functions:
          - type: drop_loot
            x: <arg:position.block_x> + 0.5
            y: <arg:position.block_y> + 0.5
            z: <arg:position.block_z> + 0.5
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: alternatives
                      children:
                        - type: item
                          item: farmersdelight:wild_rice
                          conditions:
                            - type: match_item
                              item: minecraft:shears
                        - type: item
                          item: farmersdelight:rice
              count: 1
