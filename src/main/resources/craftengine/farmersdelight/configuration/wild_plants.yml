blocks:
  farmersdelight:wild_cabbages:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      tags:
        - minecraft:flowers
        - minecraft:small_flowers
        - farmersdelight:wild_crops
        - farmersdelight:unaffected_by_rich_soil
    overrides:
      item: farmersdelight:wild_cabbages
      push-reaction: destroy
    behaviors:
      - type: liquid_flowable_block
      - type: bush_block
        bottom-block-tags:
          - minecraft:dirt
          - minecraft:sand
      - type: farmersdelight:wild_plant
        bone-meal:
          is-target: true
    state:
      auto_state: sugar_cane
      models:
        - path: farmersdelight:block/wild_cabbages
    loot:
      pools:
        - rolls: 1
          entries:
            - type: alternatives
              children:
                - type: item
                  item: farmersdelight:wild_cabbages
                  conditions:
                    - type: match_item
                      item: minecraft:shears
                - type: item
                  item: farmersdelight:cabbage_seeds
                  count: 1
                  functions:
                    - type: explosion_decay
                    - type: apply_bonus
                      enchantment: minecraft:fortune
                      formula:
                        type: binomial_with_bonus_count
                        extra: 0
                        probability: 1.0
        - rolls: 1
          conditions:
            - type: random
              value: 0.2
            - type: inverted
              term:
                type: match_item
                item: minecraft:shears
          entries:
            - type: item
              item: farmersdelight:cabbage
              count: 1
  farmersdelight:wild_onions:
