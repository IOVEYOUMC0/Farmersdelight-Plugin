                        type: binomial_with_bonus_count
                        extra: 0
                        probability: 0.5
        - rolls: 1
          conditions:
            - type: inverted
              term:
                type: match_item
                item: minecraft:shears
          entries:
            - type: item
              item: minecraft:allium
              count: 1
