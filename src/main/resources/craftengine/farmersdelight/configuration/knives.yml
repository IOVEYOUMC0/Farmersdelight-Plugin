items:
  farmersdelight:flint_knife:
    material: nether_brick
    model: ${__NAMESPACE__}:item/${__ID__}
    data:
      components:
        minecraft:enchantable:
          value: 14
        minecraft:tool:
          default_mining_speed: 1.0
          damage_per_block: 1
          rules:
            - blocks:
                - '#farmersdelight:mineable/knife'
                - minecraft:cactus
                - minecraft:melon
                - minecraft:pumpkin
                - minecraft:carved_pumpkin
                - minecraft:jack_o_lantern
                - minecraft:cobweb
                - minecraft:cake
                - '#minecraft:candle_cakes'
                - '#minecraft:wool'
                - '#minecraft:wool_carpets'
                - farmersdelight:apple_pie
                - farmersdelight:canvas_rug
                - farmersdelight:chocolate_pie
                - farmersdelight:cocoa_beans_bag
                - farmersdelight:full_tatami_mat
                - farmersdelight:glow_berries_bag
                - farmersdelight:half_tatami_mat
                - farmersdelight:pumpkin_pie
                - farmersdelight:rice_bag
                - farmersdelight:rope
                - farmersdelight:safety_net
                - farmersdelight:sweet_berries_bag
                - farmersdelight:sweet_berry_cheesecake
              speed: 4.0
              correct_for_drops: true
      item-name: <!i><lang:item.farmersdelight.flint_knife>
      max-stack-size: 1
      hide-tooltip:
      - attribute_modifiers
      attribute-modifiers:
      - type: minecraft:attack_damage
        slot: mainhand
        amount: 1.5
        operation: add_value
      - type: minecraft:attack_speed
        slot: mainhand
        amount: -2.0
        operation: add_value
      lore:
      - content:
        - ''
        - <!i><gray><lang:item.modifiers.mainhand></gray>
        - <!i><dark_green>  2.5 <lang:attribute.name.attack_damage></dark_green>
        - <!i><dark_green>  2.0 <lang:attribute.name.attack_speed></dark_green>
    settings:
      farmersdelight:sword:
        max-durability: 131
        enchantability: 14
        attack-sound: minecraft:entity.player.attack.sweep
      tags:
      - farmersdelight:tools/knives
