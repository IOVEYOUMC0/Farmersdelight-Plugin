blocks:
  farmersdelight:wild_carrots:
    settings:
      template:
      - default:hardness/none
      - default:sound/grass
      tags:
      - minecraft:flowers
      - minecraft:small_flowers
      - farmersdelight:wild_crops
      - farmersdelight:unaffected_by_rich_soil
    overrides:
      item: farmersdelight:wild_carrots
      push-reaction: destroy
    behaviors:
    - type: liquid_flowable_block
    - type: bush_block
      bottom-block-tags: &id001
      - minecraft:dirt
    - type: farmersdelight:wild_plant
      bone-meal:
        is-target: true
        success-chance: 1.0
      bottom-block-tags: *id001
    state:
      auto_state:
        type: sugar_cane
        id: farmersdelight_wild_transparent
      transparent: true
      entity_renderer:
      - type: item_display
        item: farmersdelight:wild_carrots_offset_display
        position: 0.5,0.5,0.5
    loot:
      pools:
      - rolls: 1
        entries:
        - type: alternatives
          children:
          - type: item
            item: farmersdelight:wild_carrots
            conditions:
            - type: match_item
              item: minecraft:shears
          - type: item
            item: minecraft:carrot
            count: 1
            functions:
            - type: explosion_decay
            - type: apply_bonus
              enchantment: minecraft:fortune
              formula:
                type: farmersdelight:uniform_bonus_count
