    straw:
      title: "稻草"
      desc:
        "1": "干燥的植物纤维，用于合成。用小刀收割草丛和植物可获得。"
    ham:
      title: "火腿"
      desc:
        "1": "从猪或猪灵的腿上切下的大块肉。需要用比剑更轻的工具来切割……"
    knife:
      title: "小刀"
      desc:
        "1": "轻量近战武器，挥砍快、伤害温和。可以用小刀从草丛收割稻草，并保证动物的额外掉落。"
