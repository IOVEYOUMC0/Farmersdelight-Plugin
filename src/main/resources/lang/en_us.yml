      title: "Wild Cabbages"
      desc:
        "1": "Cabbages can be commonly found as a wild plant in beach coasts."
    wild_onions:
      title: "Wild Onions"
      desc:
        "1": "Onions can be commonly found as a wild plant in temperate lands, such as plains and forests."
    wild_tomatoes:
      title: "Tomato Shrub"
      desc:
        "1": "Tomatoes can be commonly found as a wild plant in arid lands, such as savannas and deserts."
    wild_rice:
      title: "Wild Rice"
      desc:
        "1": "Rice can be commonly found as a wild plant in the ponds of wet lands, such as swamps and jungles."
    wheat_dough:
      title: "Wheat Dough"
      desc:
        "1": "Craft 3 wheat with 1 egg to make 3 wheat dough."
        "2": "Mix wheat with a water bucket to make wheat dough; the bucket is returned."
    straw:
      title: "Straw"
      desc:
        "1": "A dry plant fiber used in crafting. Obtained by cutting grassy crops and plants with a Knife."
    ham:
      title: "Ham"
      desc:
        "1": "A large cut of meat from a Pig or Hoglin's leg.\n\nYou will need something lighter than a Sword to cut one..."
    knife:
      title: "Knife"
      desc:
        "1": "A lightweight melee weapon, with fast swings and gentle damage.\n\nThey can harvest Straw from grasses, and guarantee secondary drops from animals."
