      title: "Organic Compost"
      desc:
        "1": "Organic Compost decomposes naturally over time, eventually turning into Rich Soil."
        "2": "Sunlight and adjacent water speed up decomposition."
        "3": "Nearby activators (mushrooms, mycelium, podzol, compost...) accelerate decomposition."
        "4": "Right-click with a water bucket to advance one stage immediately."
